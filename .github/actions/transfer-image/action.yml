name: Verified image file transfer
description: Commit one existing PNG/WebP and verify exact bytes at the returned immutable commit.
inputs:
  file:
    description: Existing local file on this runner; never a Base64 or text bridge
    required: true
  repository:
    description: Authorized owner/repository
    required: true
  branch:
    description: Existing unprotected editorial-handoff or image-transfer-proof branch
    required: true
  destination:
    description: Immutable image path under the approved namespace
    required: true
  sha256:
    description: Independently observed original-file SHA-256
    required: true
  receipt:
    description: New local receipt filename for this operation
    required: true
  token:
    description: Existing repository-scoped token supplied by the authorized execution host
    required: true
  known-safety-block:
    description: Set true when the requested operation was blocked; alternate transport is prohibited
    default: 'false'
outputs:
  commit_sha:
    description: Commit at which exact image bytes were verified
    value: ${{ steps.transfer.outputs.commit_sha }}
  sha256:
    description: Verified SHA-256
    value: ${{ steps.transfer.outputs.sha256 }}
  reused:
    description: True when identical committed bytes were reused without another write
    value: ${{ steps.transfer.outputs.reused }}
runs:
  using: composite
  steps:
    - name: Commit local image and verify binary read-back
      id: transfer
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        IMAGE_FILE: ${{ inputs.file }}
        IMAGE_REPO: ${{ inputs.repository }}
        IMAGE_BRANCH: ${{ inputs.branch }}
        IMAGE_DESTINATION: ${{ inputs.destination }}
        IMAGE_HASH: ${{ inputs.sha256 }}
        IMAGE_RECEIPT: ${{ inputs.receipt }}
        KNOWN_BLOCK: ${{ inputs.known-safety-block }}
      run: |
        set -euo pipefail
        block=()
        if [ "$KNOWN_BLOCK" = "true" ]; then block=(--known-safety-block); fi
        node "$GITHUB_ACTION_PATH/../../../_tools/github-image-transfer.mjs" \
          --file "$IMAGE_FILE" --repo "$IMAGE_REPO" --branch "$IMAGE_BRANCH" \
          --destination "$IMAGE_DESTINATION" --sha256 "$IMAGE_HASH" \
          --receipt "$IMAGE_RECEIPT" "${block[@]}"
        node --input-type=module - <<'NODE'
        import fs from 'node:fs';
        const r = JSON.parse(fs.readFileSync(process.env.IMAGE_RECEIPT, 'utf8'));
        if (r.status !== 'TRANSFER_VERIFIED' || r.read_back_verified !== true) throw Error('No verified transfer');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit_sha=${r.commit_sha}\nsha256=${r.sha256}\nreused=${r.reused}\n`);
        NODE
