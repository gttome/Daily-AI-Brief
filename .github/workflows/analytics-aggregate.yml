name: Aggregate privacy-conscious analytics

on:
  schedule:
    - cron: '15 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Edition date (YYYY-MM-DD); defaults to America/Chicago today
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-ai-brief-analytics
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect aggregate counters
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          TZ: America/Chicago
        run: |
          edition_date="${REQUESTED_DATE:-$(date +%F)}"
          node _generator/cli.mjs collect-analytics --date "$edition_date" --out "_records/analytics/$edition_date.json"
          node _generator/cli.mjs refresh-feedback-analytics --date "$edition_date" --days 7
          node _generator/cli.mjs evaluate-personal-learning --out _records/editorial-learning/current.json
      - name: Validate and commit aggregate
        run: |
          node _tools/validate-contracts.mjs
          node _generator/cli.mjs integration-check
          git config user.name "Daily AI Brief Automation"
          git config user.email "130812356+gttome@users.noreply.github.com"
          git add _records/analytics _records/editorial-learning/current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update privacy-conscious Daily AI Brief analytics"
          git push origin HEAD:main
