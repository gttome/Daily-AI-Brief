name: Verify publication freshness
on:
  schedule:
    - cron: '15 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-ai-brief-freshness
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node _tools/freshness-check.mjs
