name: Deterministic publication CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run contract and generator tests
        run: |
          node --test _generator/test/*.test.mjs
          node _tools/validate-contracts.mjs

      - name: Validate repository state
        run: node _generator/cli.mjs validate-repo --commit "${GITHUB_SHA}"

      - name: Validate atomic publication change set
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base_sha="${EVENT_BEFORE:-${PR_BASE:-}}"
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          BASE_SHA="$base_sha" HEAD_SHA="$HEAD_SHA" node _generator/validate-commit.mjs

      - name: Validate append-only ledgers
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base_sha="${EVENT_BEFORE:-${PR_BASE:-}}"
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          BASE_SHA="$base_sha" HEAD_SHA="$HEAD_SHA" node _generator/validate-ledgers.mjs

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
