name: Daily AI Brief deterministic delta validation

on:
  workflow_run:
    workflows: ["Deterministic publication CI"]
    types: [completed]
    branches: [main]
  schedule:
    # GitHub cron is UTC. Trigger both DST possibilities; the Chicago-hour gate runs exactly one.
    - cron: '0 15,16 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Edition date (YYYY-MM-DD). Defaults to current Chicago date.
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: daily-ai-brief-delta-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Gate scheduled run to 10:00 America/Chicago
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_CONCLUSION" = "success" ] && [ "$WORKFLOW_EVENT" = "push" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$(TZ=America/Chicago date +%H)" = "10" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Resolve edition date
        if: steps.gate.outputs.run == 'true'
        id: date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            value="$REQUESTED_DATE"
          else
            value="$(TZ=America/Chicago date +%F)"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Detect already-closed edition
        id: closed
        if: steps.gate.outputs.run == 'true'
        env:
          EDITION_DATE: ${{ steps.date.outputs.value }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const date=process.env.EDITION_DATE;
          let closed=false;
          try {
            const lifecycle=JSON.parse(fs.readFileSync('_records/publication/'+date+'/lifecycle.json','utf8'));
            const completion=JSON.parse(fs.readFileSync('_records/publication/'+date+'/completion.json','utf8'));
            closed=['COMPLETED','CC_SYNCED'].includes(lifecycle.stage)&&lifecycle.terminal_outcome==='COMPLETED'&&completion.phase==='live_verified'&&completion.pages?.conclusion==='success';
          } catch {}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'value='+(closed?'true':'false')+'\n');
          NODE

      - name: Build deterministic Watchlist delta receipt
        if: steps.gate.outputs.run == 'true' && steps.closed.outputs.value != 'true'
        run: |
          set -euo pipefail
          prior_commit="$(git log --format=%H -- _data/watchlist.json | sed -n '2p')"
          args=(--next _data/watchlist.json --out /tmp/watchlist-delta.json)
          if [ -n "$prior_commit" ]; then
            git show "$prior_commit:_data/watchlist.json" > /tmp/prior-watchlist.json
            args+=(--prior /tmp/prior-watchlist.json)
          fi
          node _tools/watchlist-delta-plan.mjs "${args[@]}"

      - name: Resolve matching Pages deployment
        id: pages
        if: steps.gate.outputs.run == 'true' && steps.closed.outputs.value != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const expectedSha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha
              : context.sha;
            const attempts = 36;
            for (let i = 0; i < attempts; i++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo,
                head_sha: expectedSha,
                per_page: 100
              });
              const pages = data.workflow_runs
                .filter(run => run.name === 'pages build and deployment')
                .sort((a,b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              const run = pages[0];
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`Matching Pages deployment ${run.id} ended ${run.conclusion} for ${expectedSha}.`);
                  return;
                }
                core.setOutput('run_id', String(run.id));
                core.setOutput('verified_at', run.updated_at || new Date().toISOString());
                core.setOutput('expected_sha', expectedSha);
                core.setOutput('deployment_url', 'https://gttome.github.io/Daily-AI-Brief/');
                core.info(`Matching Pages deployment ${run.id} succeeded for ${expectedSha}.`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed(`No successful completed Pages deployment observed for ${expectedSha} within the bounded validation window.`);

      - name: Build runtime Pages completion evidence
        if: steps.gate.outputs.run == 'true' && steps.closed.outputs.value != 'true' && steps.pages.outputs.run_id != ''
        env:
          EDITION_DATE: ${{ steps.date.outputs.value }}
          PAGES_RUN_ID: ${{ steps.pages.outputs.run_id }}
          PAGES_VERIFIED_AT: ${{ steps.pages.outputs.verified_at }}
          EXPECTED_SHA: ${{ steps.pages.outputs.expected_sha }}
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment_url }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const date=process.env.EDITION_DATE;
          const dir=path.join('_records','publication',date);
          if (!fs.existsSync(dir)) {
            console.log(`No publication directory for ${date}; current-day edition has not reached validated publication yet. Skipping Pages completion evidence until publication exists.`);
            process.exit(0);
          }
          const candidates=fs.readdirSync(dir)
            .filter(name=>name.endsWith('.validated.json'))
            .map(name=>JSON.parse(fs.readFileSync(path.join(dir,name),'utf8')))
            .filter(record=>record.edition_id===`dab-edition-${date}`)
            .sort((a,b)=>Date.parse(b.observed_at||0)-Date.parse(a.observed_at||0));
          if(!candidates.length) {
            console.log(`No validated publication event found for ${date}; skipping Pages completion evidence until publication exists.`);
            process.exit(0);
          }
          const validated=candidates[0];
          const edition=JSON.parse(fs.readFileSync(path.join('_data','editions',date+'.json'),'utf8'));
          const verifiedAt=process.env.PAGES_VERIFIED_AT||new Date().toISOString();
          const expectedSha=process.env.EXPECTED_SHA;
          const completion={
            ...validated,
            schema_version:'2.0.0',
            phase:'pages_verified',
            observed_at:verifiedAt,
            commit_sha:expectedSha,
            production_sha:expectedSha,
            deployed_sha:expectedSha,
            file_set:{...validated.file_set,assets:(edition.stories||[]).map(story=>story.image?.path).filter(Boolean)},
            pages:{
              run_id:Number(process.env.PAGES_RUN_ID),
              conclusion:'success',
              verified_at:verifiedAt,
              deployed_sha:expectedSha,
              deployment_url:process.env.DEPLOYMENT_URL
            },
            supersedes_event_id:validated.event_id
          };
          fs.writeFileSync('/tmp/completion-evidence.json',JSON.stringify(completion,null,2)+'\n');
          NODE
      - name: Run deterministic delta validation
        if: steps.gate.outputs.run == 'true' && steps.closed.outputs.value != 'true'
        id: validation
        continue-on-error: true
        run: |
          set +e
          args=(--date "${{ steps.date.outputs.value }}" --out /tmp/daily-validation.json)
          if [ -f /tmp/completion-evidence.json ]; then args+=(--completion /tmp/completion-evidence.json); fi
          node _tools/daily-validation.mjs "${args[@]}"
          exit_code="$?"
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Project canonical status for already-closed edition
        if: steps.gate.outputs.run == 'true' && steps.closed.outputs.value == 'true'
        run: |
          set -euo pipefail
          node _tools/publication-lifecycle.mjs project \
            --date "${{ steps.date.outputs.value }}" \
            --out /tmp/publication-status.json

      - name: Build read-only Command Center refresh handoff for already-closed edition
        if: steps.gate.outputs.run == 'true' && steps.closed.outputs.value == 'true'
        run: |
          set -euo pipefail
          args=( \
            --status /tmp/publication-status.json \
            --policy docs/operations/efficiency-operating-policy.json \
            --out /tmp/command-center-delta.json \
          )
          incident="_records/command-center/${{ steps.date.outputs.value }}-incident-and-recovery.json"
          if [ -f "$incident" ]; then args+=(--incident "$incident"); fi
          node _tools/command-center-delta.mjs "${args[@]}"
          echo 'Closed-edition refresh is read-only: no editorial, media, Watchlist, image, lifecycle, or publication work is replayed.'

      - name: Prepare protected completion persistence
        id: persistence
        if: steps.gate.outputs.run == 'true' && steps.closed.outputs.value != 'true' && steps.validation.outcome == 'success'
        env:
          EDITION_DATE: ${{ steps.date.outputs.value }}
          EXPECTED_SHA: ${{ steps.pages.outputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EDITION_DATE" < "2026-09-24" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Automatic protected completion persistence is effective beginning 2026-09-24."
            exit 0
          fi
          completion="_records/publication/$EDITION_DATE/completion.json"
          state="_records/run-state/$EDITION_DATE.json"
          lifecycle="_records/publication/$EDITION_DATE/lifecycle.json"
          branch="finalization/$EDITION_DATE-${EXPECTED_SHA:0:8}"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            remote_head="$(git rev-parse "origin/$branch")"
            git show "origin/$branch:$completion" >/dev/null
            git show "origin/$branch:$state" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.exit(x.stage==='CLOSED'&&x.publication_lifecycle==='closed'?0:1)})"
            git show "origin/$branch:$lifecycle" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.exit(['COMPLETED','CC_SYNCED'].includes(x.stage)&&x.terminal_outcome==='COMPLETED'?0:1)})"
            git show "origin/$branch:data/operations/current-edition.json" >/dev/null
            git show "origin/$branch:data/operations/publication-status.json" >/dev/null
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "head_sha=$remote_head" >> "$GITHUB_OUTPUT"
            echo "Reusing durable finalization branch $branch at $remote_head."
            exit 0
          fi
          if [ -f "$completion" ] && [ -f "$state" ] && [ -f "$lifecycle" ] && node -e "const s=require('./$state');const c=require('./$completion');const l=require('./$lifecycle');process.exit(s.stage==='CLOSED'&&s.publication_lifecycle==='closed'&&['COMPLETED','CC_SYNCED'].includes(l.stage)&&l.terminal_outcome==='COMPLETED'&&c.phase==='live_verified'&&c.pages?.conclusion==='success'?0:1)"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f /tmp/completion-evidence.json
          test -f /tmp/daily-validation.json
          test -f /tmp/watchlist-delta.json
          mkdir -p "$(dirname "$completion")" _records/command-center
          cp /tmp/completion-evidence.json "$completion"
          cc="_records/command-center/$EDITION_DATE-public-safe-delta.json"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/pulls" --jq '.[0].number // 0' 2>/dev/null || echo 0)"
          if [ "$pr" -le 0 ]; then echo "No protected publication PR found for $EXPECTED_SHA."; exit 1; fi
          candidate_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
          publication_merge_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merge_commit_sha // empty')"
          if ! [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$publication_merge_sha" =~ ^[0-9a-f]{40}$ ]]; then echo "Publication PR evidence is incomplete."; exit 1; fi
          ci_run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$candidate_sha&per_page=100" --jq '[.workflow_runs[] | select(.name=="Deterministic publication CI" and .event=="pull_request" and .conclusion=="success")] | sort_by(.updated_at) | reverse | .[0].id // 0')"
          if [ "$ci_run_id" -le 0 ]; then echo "No successful protected CI found for publication candidate $candidate_sha."; exit 1; fi
          node - "$completion" /tmp/daily-validation.json "$EXPECTED_SHA" "$candidate_sha" "$publication_merge_sha" "$pr" "$ci_run_id" <<'NODE'
          const fs=require('fs');
          const [p,validationPath,productionSha,candidateSha,mergeSha,prNumber,ciRunId]=process.argv.slice(2);
          const x=JSON.parse(fs.readFileSync(p,'utf8')),v=JSON.parse(fs.readFileSync(validationPath,'utf8'));
          const pass=id=>v.checks?.some(check=>check.check_id===id&&check.result==='pass');
          const required=['publication_receipt','pages_deployment','live_changed_routes','live_homepage_edition','live_dated_edition','live_image_assets'];
          if(v.final_result!=='pass'||required.some(id=>!pass(id)))throw new Error('live_completion_checks_not_all_passed');
          x.schema_version='2.0.0';x.phase='live_verified';x.production_sha=productionSha;x.deployed_sha=productionSha;x.candidate_sha=candidateSha;x.publication_merge_sha=mergeSha;x.pr_number=Number(prNumber);x.ci_run_id=Number(ciRunId);
          x.live_verified_at=v.ended_at;x.live_verification={final_result:'pass',homepage_edition_date:v.date,dated_edition_verified:true,route_count:v.route_count,checks:required,source_validation_run_id:process.env.GITHUB_RUN_ID?Number(process.env.GITHUB_RUN_ID):null};
          x.lifecycle_status='completed';x.completion_persistence='protected_pull_request';fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
          node _tools/publication-lifecycle.mjs finalize --date "$EDITION_DATE" --completion "$completion" --candidate-sha "$candidate_sha" --pr "$pr" --ci-run-id "$ci_run_id" --publication-merge-sha "$publication_merge_sha"
          args=( \
            --status data/operations/publication-status.json \
            --validation /tmp/daily-validation.json \
            --watchlist /tmp/watchlist-delta.json \
            --policy docs/operations/efficiency-operating-policy.json \
            --out /tmp/command-center-delta.json \
          )
          incident="_records/command-center/$EDITION_DATE-incident-and-recovery.json"
          if [ -f "$incident" ]; then args+=(--incident "$incident"); fi
          node _tools/command-center-delta.mjs "${args[@]}"
          cp /tmp/command-center-delta.json "$cc"
          node _tools/run-state.mjs finalize --date "$EDITION_DATE" --production-sha "$EXPECTED_SHA" --pr "$pr" --completion "$completion" --validation /tmp/daily-validation.json --cc "$cc"
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$completion" "$state" "$cc" "_records/publication/$EDITION_DATE/lifecycle.json" "data/operations/current-edition.json" "data/operations/publication-status.json"
          git commit -m "Persist $EDITION_DATE publication completion and closure evidence"
          git push origin "HEAD:$branch"
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge completion evidence through protected CI
        if: steps.persistence.outputs.needed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          FINALIZATION_BRANCH: ${{ steps.persistence.outputs.branch }}
          FINALIZATION_SHA: ${{ steps.persistence.outputs.head_sha }}
          EDITION_DATE: ${{ steps.date.outputs.value }}
        with:
          script: |
            const branch=process.env.FINALIZATION_BRANCH,headSha=process.env.FINALIZATION_SHA;
            let prs=(await github.rest.pulls.list({...context.repo,state:'open',base:'main',head:context.repo.owner+':'+branch})).data;
            let pr=prs[0];
            if(!pr){
              try{
                pr=(await github.rest.pulls.create({...context.repo,head:branch,base:'main',title:'Finalize Daily AI Brief '+process.env.EDITION_DATE,body:'Persist Pages-bound completion evidence, deterministic delta-validation evidence, public-safe Command Center delta, and CLOSED run-state through the same protected main path.'})).data;
              }catch(error){core.setFailed('Automatic completion PR creation failed: '+error.message);return;}
            }
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'ci.yml',ref:branch});
            let passing=null;
            for(let i=0;i<36;i++){
              await new Promise(resolve=>setTimeout(resolve,5000));
              const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'ci.yml',branch,event:'workflow_dispatch',per_page:20})).data.workflow_runs;
              const run=runs.find(x=>x.head_sha===headSha);
              if(run?.status==='completed'){
                if(run.conclusion!=='success'){core.setFailed('Finalization CI '+run.id+' ended '+run.conclusion);return;}
                passing=run;break;
              }
            }
            if(!passing){core.setFailed('No successful protected finalization CI observed in bounded window.');return;}
            pr=(await github.rest.pulls.get({...context.repo,pull_number:pr.number})).data;
            if(pr.head.sha!==headSha){core.setFailed('Finalization PR head changed after passing CI.');return;}
            const merged=await github.rest.pulls.merge({...context.repo,pull_number:pr.number,sha:headSha,merge_method:'squash'});
            if(!merged.data.merged){core.setFailed('Protected completion merge denied: '+(merged.data.message||'not merged'));return;}
            core.info('Completion evidence merged through protected main at '+merged.data.sha+'.');

      - name: Publish compact receipts to job summary
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          for receipt in /tmp/publication-status.json /tmp/completion-evidence.json /tmp/watchlist-delta.json /tmp/daily-validation.json /tmp/command-center-delta.json; do
            if [ -f "$receipt" ]; then
              echo "#### $(basename "$receipt")" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload validation receipts
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-validation-${{ steps.date.outputs.value }}-${{ github.run_id }}
          path: |
            /tmp/publication-status.json
            /tmp/completion-evidence.json
            /tmp/daily-validation.json
            /tmp/watchlist-delta.json
            /tmp/command-center-delta.json
          retention-days: 30
          if-no-files-found: warn

      - name: Create deduplicated failure alert
        if: steps.gate.outputs.run == 'true' && steps.closed.outputs.value != 'true' && steps.validation.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const title = 'Daily AI Brief alert: deterministic validation failure';
            const {data: issues} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body: `Deterministic validation failed for ${{ steps.date.outputs.value }}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            }

      - name: Enforce deterministic validation result
        if: steps.gate.outputs.run == 'true' && steps.closed.outputs.value != 'true' && steps.validation.outcome == 'failure'
        run: exit 1
