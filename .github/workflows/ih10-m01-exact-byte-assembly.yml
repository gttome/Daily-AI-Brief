name: IH10 m01 exact-byte assembly

on:
  push:
    branches:
      - qualification-image-harness/2026-09-27-IH10
    paths:
      - '_records/qualification-image-harness/2026-09-27-IH10/m01-assemble.trigger'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact PNG
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          out="$base/images/m01-attempt-1.png"
          mkdir -p "$(dirname "$out")"
          cat "$base"/m01-blob-chunks/*.b64 | base64 --decode > "$out"
          actual="$(sha256sum "$out" | awk '{print $1}')"
          test "$actual" = "7e7b69e19c9dc2533b8ea3e179d8c3bd05e42ecb7b17d232748bc413233cb4ea"
          test "$(stat -c%s "$out")" = "1008672"
      - name: Commit exact bytes and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          rm -rf "$base/m01-blob-chunks" "$base/m01-assemble.trigger"
          rm -f ".github/workflows/ih10-m01-exact-byte-assembly.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist exact reviewed IH10 m01 image bytes"
          git push
