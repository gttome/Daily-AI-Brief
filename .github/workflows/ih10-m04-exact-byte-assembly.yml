name: IH10 m04 exact-byte image assembly

on:
  push:
    branches:
      - qualification-image-harness/2026-09-27-IH10
    paths:
      - '_records/qualification-image-harness/2026-09-27-IH10/assemble-m04.trigger'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact PNG
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          out="$base/images/m04-attempt-1.png"
          mkdir -p "$(dirname "$out")"
          cat "$base"/blob-chunks-m04/*.b64 | base64 --decode > "$out"
          actual="$(sha256sum "$out" | awk '{print $1}')"
          test "$actual" = "e5e727e77a0322143dea2cc63b8e1ddc28e04eb0fc0b7fb5b6fe0928ef8bdad3"
          test "$(stat -c%s "$out")" = "1857341"
      - name: Commit exact bytes and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          rm -rf "$base/blob-chunks-m04" "$base/assemble-m04.trigger"
          rm -f ".github/workflows/ih10-m04-exact-byte-assembly.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist exact reviewed IH10 m04 image bytes"
          git push
