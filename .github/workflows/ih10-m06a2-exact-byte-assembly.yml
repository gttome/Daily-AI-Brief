name: IH10 m06 attempt2 exact-byte assembly

on:
  push:
    branches:
      - qualification-image-harness/2026-09-27-IH10
    paths:
      - '_records/qualification-image-harness/2026-09-27-IH10/m06a2-assemble.trigger'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact PNG
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          out="$base/images/m06-attempt-2.png"
          mkdir -p "$(dirname "$out")"
          cat "$base"/m06a2-blob-chunks/*.b64 | base64 --decode > "$out"
          actual="$(sha256sum "$out" | awk '{print $1}')"
          test "$actual" = "9988767aa6772c214ee61d5688d113dbedaa4c2df6efe797b82d590bef286618"
          test "$(stat -c%s "$out")" = "1937045"
      - name: Commit exact bytes and clean scaffolding
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          rm -rf "$base/m06a2-blob-chunks" "$base/m06a2-assemble.trigger"
          rm -f ".github/workflows/ih10-m06a2-exact-byte-assembly.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist exact reviewed IH10 m06 attempt 2 image bytes"
          git push
