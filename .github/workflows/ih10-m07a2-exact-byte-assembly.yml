name: IH10 m07a2 exact-byte assembly

on:
  push:
    branches:
      - qualification-image-harness/2026-09-27-IH10
    paths:
      - '_records/qualification-image-harness/2026-09-27-IH10/assemble-m07a2.trigger'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact m07 attempt 2 PNG
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          out="$base/images/m07-attempt-2.png"
          mkdir -p "$(dirname "$out")"
          cat "$base"/blob-chunks-m07a2/*.b64 | base64 --decode > "$out"
          actual="$(sha256sum "$out" | awk '{print $1}')"
          test "$actual" = "28ddc8b87620e4ad4e53003717fcd0fe6edea9c332c806b88ee5e0ef6dad4fbe"
          test "$(stat -c%s "$out")" = "1939308"
      - name: Commit exact bytes and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          rm -rf "$base/blob-chunks-m07a2" "$base/assemble-m07a2.trigger"
          rm -f ".github/workflows/ih10-m07a2-exact-byte-assembly.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist exact reviewed IH10 m07 attempt 2 image bytes"
          git push
