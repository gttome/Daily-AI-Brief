name: IH10 m08 exact-byte assembly

on:
  push:
    branches:
      - qualification-image-harness/2026-09-27-IH10
    paths:
      - '_records/qualification-image-harness/2026-09-27-IH10/m08-assemble.trigger'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact PNG
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          out="$base/images/m08-attempt-1.png"
          mkdir -p "$(dirname "$out")"
          cat "$base"/m08-blob-chunks/*.b64 | base64 --decode > "$out"
          actual="$(sha256sum "$out" | awk '{print $1}')"
          test "$actual" = "d2e935233355a00cf078e36817b16f245e3706670223ff99a11472d2d2773afe"
          test "$(stat -c%s "$out")" = "1014157"
      - name: Commit exact bytes and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          base="_records/qualification-image-harness/2026-09-27-IH10"
          rm -rf "$base/m08-blob-chunks" "$base/m08-assemble.trigger"
          rm -f ".github/workflows/ih10-m08-exact-byte-assembly.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist exact reviewed IH10 m08 image bytes"
          git push
