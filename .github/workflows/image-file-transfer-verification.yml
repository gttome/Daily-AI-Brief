name: Image file transfer verification
on:
  workflow_dispatch:
  push:
    branches: ['repair/image-file-transfer-*']
    paths: ['.github/workflows/image-file-transfer-verification.yml']
permissions:
  contents: write
concurrency:
  group: image-transfer-verification-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Reconcile living references on the authorized repair branch only
        if: github.ref_name == 'repair/image-file-transfer-2026-09-28'
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const header='## September 28, 2026 — One-operation image file transfer';
          const amendment=`${header}\n\nUse \`github-image-file-transfer-v1\` for permitted image uploads from an authenticated file-capable host. The shared \`transferImageFile\` function, \`_tools/github-image-transfer.mjs\` and \`.github/actions/transfer-image\` take an actual local PNG/WebP, perform one Contents API write and verify raw bytes at the returned immutable commit. Base64 stays inside executable code; no per-image text bridges, bespoke workflow or owner upload. Identical existing bytes are verified and reused without another write; different bytes, protected branches, unsafe paths, denials and uncertain writes fail closed. Keep one writer per handoff branch.\n\nA verified transfer is not image acceptance. All V2 image quality and visual-only task-delivery requirements remain. The local file and existing repository credential must be present on the same host. This code does not add a file-upload parameter to a text-only ChatGPT connector or prove native-output delivery to GitHub Actions. Known safety-blocked operations must not be replayed through this helper or another endpoint. Q24's previously blocked attempt-2 branch operation remains separate from the independent transport proof; do not report it recovered from a proof-branch upload.\n\nSee [Image file transfer](image-file-transfer.md) for interfaces, recovery codes, host requirements and proof scope. Preserve all frozen Q24 components and failed outputs.\n\n---\n\n`;
          for(const file of ['docs/operations/START-HERE.md','docs/operations/LIVING-SYSTEM-OPERATIONS.md','docs/operations/automated-image-execution.md']){
            const prior=fs.readFileSync(file,'utf8');
            if(!prior.includes(header)){const first=prior.indexOf('\n');fs.writeFileSync(file,prior.slice(0,first+1)+'\n'+amendment+prior.slice(first+1));}
          }
          const file='_generator/test-selection.json',data=JSON.parse(fs.readFileSync(file,'utf8'));
          if(!data.rules.some(rule=>rule.patterns.includes('_generator/lib/github-image-transfer.mjs'))){
            data.rules.unshift({patterns:['_generator/lib/github-image-transfer.mjs','_tools/github-image-transfer.mjs','_tools/verify-image-transfer.mjs','_generator/test/github-image-transfer.test.mjs','.github/actions/transfer-image/action.yml','docs/operations/image-file-transfer.md'],tier:'A',tests:['_generator/test/github-image-transfer.test.mjs','_generator/test/image-execution.test.mjs','_generator/test/image-quality-gate.test.mjs']});
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }
          NODE
      - name: Run targeted transfer and unchanged image tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/image-transfer-test-logs
          node --test _generator/test/github-image-transfer.test.mjs _generator/test/image-execution.test.mjs _generator/test/image-quality-gate.test.mjs _generator/test/native-image-delivery.test.mjs | tee /tmp/image-transfer-test-logs/targeted.log
      - name: Run full repository tests and contracts
        run: |
          set -euo pipefail
          node --test _generator/test/*.test.mjs | tee /tmp/image-transfer-test-logs/full.log
          node _tools/validate-contracts.mjs | tee /tmp/image-transfer-test-logs/contracts.log
      - name: Persist only coordinated living documents and test routing
        if: github.ref_name == 'repair/image-file-transfer-2026-09-28'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/START-HERE.md docs/operations/LIVING-SYSTEM-OPERATIONS.md docs/operations/automated-image-execution.md _generator/test-selection.json
          if ! git diff --cached --quiet; then
            git commit -m 'Reconcile shared file-transfer operating guidance and affected test routing'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          git rev-parse HEAD > /tmp/image-transfer-test-logs/implementation-commit.txt
      - name: Live exact-byte transfer and no-write repeat on independent proof branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node _tools/verify-image-transfer.mjs | tee /tmp/image-transfer-test-logs/live-proof.log
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-file-transfer-verification
          path: |
            /tmp/image-transfer-test-logs
            ${{ runner.temp }}/image-transfer-proof-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          retention-days: 14
