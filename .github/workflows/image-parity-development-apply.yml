name: Image parity implementation verification
on:
  push:
    branches: ['repair/automated-image-parity-2026-09-28']
    paths: ['.github/workflows/image-parity-development-apply.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify transport and apply exact reviewed patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'repair/automated-image-parity-2026-09-28'
          mkdir -p /tmp/image-parity-proof
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          parts=[Path(f'_records/development/image-parity/patch.part{i}').read_text() for i in range(1,5)]
          original=parts[1].encode()
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()=='b0567d89e6897490ec2661bedf6295afbe14e8b7'
          parts[1]=parts[1].replace('BzEkBnHH','BzEkzBnHH').replace('9z4nrky1ybNVHT','9z4nrky1XfyNVHT')
          expected=['75aaee87f323ebfc1e8282b8a6e2b0c4a1990b33','f1bc04b8eb0cffb2f632b4772b48bf3c2b71bbee','aedc05f79836841f96dc81b698a457b94ab98908','d75bd151643b77e64b3f10588d991dede5ec68f9']
          for part,want in zip(parts,expected):
              b=part.encode();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==want
          patch=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='ad607e6bd110eb117516134b2b9f43c13740f3e1b00c3aff66e254e3999a83da'
          Path('/tmp/image-parity-proof/reviewed.patch').write_bytes(patch)
          Path('/tmp/image-parity-proof/binding.json').write_text(json.dumps({'baseline':'1def5c4ba158247a9c02106dc4e4820d80a7133d','execution_commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'patch_sha256':hashlib.sha256(patch).hexdigest(),'transport_correction':'Two known text-transport substitutions in part 2 corrected before per-part/full-patch integrity checks; no execution or approval bypass.','production_mutation':False,'native_image_calls':0,'paid_model_api_calls':0},indent=2)+'\n')
          PY
          git apply --check /tmp/image-parity-proof/reviewed.patch
          git apply /tmp/image-parity-proof/reviewed.patch
          git diff --stat > /tmp/image-parity-proof/diff-stat.txt
      - name: Run full image-parity and historical regressions
        run: |
          set -euo pipefail
          node --test _generator/test/image-execution.test.mjs _generator/test/qualification-image-harness.test.mjs _generator/test/continuous-qualification-contract.test.mjs _generator/test/qualification-image-subject-lock.test.mjs _generator/test/image-quality-gate.test.mjs | tee /tmp/image-parity-proof/targeted.log
          node --test _generator/test/*.test.mjs | tee /tmp/image-parity-proof/full-suite.log
          node _tools/validate-contracts.mjs | tee /tmp/image-parity-proof/contracts.log
      - name: Persist implementation without transport helpers
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$GITHUB_REF_NAME | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/image-parity-development-capture.yml .github/workflows/image-parity-development-apply.yml _records/development/image-parity/patch.part1 _records/development/image-parity/patch.part2 _records/development/image-parity/patch.part3 _records/development/image-parity/patch.part4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _generator _tools docs
          git commit -m 'Share automated image execution between production and qualification; prohibit manual image handoffs'
          git diff --stat 1def5c4ba158247a9c02106dc4e4820d80a7133d HEAD > /tmp/image-parity-proof/final-diff-stat.txt
          git rev-parse HEAD > /tmp/image-parity-proof/implementation-commit.txt
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-parity-implementation-proof
          path: /tmp/image-parity-proof/
          retention-days: 14
          if-no-files-found: error
