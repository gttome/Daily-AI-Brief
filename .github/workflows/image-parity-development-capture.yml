name: Image parity development capture
on:
  push:
    branches: ['repair/automated-image-parity-2026-09-28']
    paths: ['.github/workflows/image-parity-development-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Export pinned development inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/image-parity
          git ls-tree -rl HEAD > /tmp/image-parity/tree.txt
          python3 - <<'PY'
          import subprocess,zipfile,json
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/image-parity/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  if name and Path(name).is_file() and (name.startswith(('_generator/','_tools/','_contracts/','_architecture/','_plans/','docs/','.github/')) or name in ('package.json','README.md') or (name.startswith('_records/') and name.endswith('.md'))):
                      z.write(name,name)
          Path('/tmp/image-parity/binding.json').write_text(json.dumps({'baseline':'1def5c4ba158247a9c02106dc4e4820d80a7133d','execution_commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'production_mutation':False,'model_api_calls':0},indent=2)+'\n')
          PY
          git grep -n -E 'fresh_image_only|buildQualificationImageGenerationExecution|validateQualificationImageGenerationExecution|manual.*image|image.*manual' -- _generator _tools .github _plans docs > /tmp/image-parity/call-sites.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-parity-development-inputs
          path: /tmp/image-parity/
          retention-days: 14
          if-no-files-found: error
