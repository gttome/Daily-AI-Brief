name: Native image delivery implementation verification
on:
  push:
    branches: ['repair/native-image-task-delivery-2026-09-28']
    paths: ['.github/workflows/native-image-delivery-development-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Append coordinated operating amendments and route targeted tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-delivery-proof
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected={'docs/operations/START-HERE.md':'cb1cd9362221ee0003f79dc7732c407115916afe','docs/operations/LIVING-SYSTEM-OPERATIONS.md':'8ecb9d4d9096c00d0c55a1833157a5c2b3303d58','docs/operations/automated-image-execution.md':'f2bc4418e033b0e5b98d88ab031af9138f558814'}
          prefix='''## September 28, 2026 — Visual-only native generation task delivery

          > [!IMPORTANT]
          > Use `visual-only-task-delivery-v1` alongside the unchanged V2 image gates. The supervisor prepares and verifies an automatic image-only task whose prompt is the exact compiled visual instruction. Do not put GitHub, run status, capture, review, retry or continuation instructions into that task prompt. No owner-created chat or manual transfer is required; hidden context isolation is not asserted.

          `_generator/lib/native-image-delivery.mjs` and `_tools/native-image-delivery.mjs` bind the actual submitted task text and select the next safe unfinished operation. Recover existing generated bytes, complete exact Git capture/read-back and rejection review before allocating another attempt. A pending task is not permission to duplicate generation; four attempts remain the maximum. A preserved Library copy is not a Git receipt, and a compiler/test PASS is not successful native generation. The execution host must still demonstrate scheduling, native output recovery, review and exact persistence.

          See [Native image task delivery](native-image-task-delivery.md). Preserve frozen Q24 requests, its five completed components, cutoff/policies, failed outputs and earlier receipts. No acceptance gate, historical result or public edition is changed by this repair. Protected CI and normal merge are required before adoption; actual corrected-image and unattended-production proof remain separate.

          ---

          '''
          for name,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',name],text=True).strip()==sha, name
              p=Path(name);old=p.read_text();first,rest=old.split('\n',1)
              p.write_text(first+'\n\n'+prefix+rest.lstrip('\n'))
          p=Path('_generator/test-selection.json');data=json.loads(p.read_text())
          data['rules'].insert(0,{'patterns':['_generator/lib/native-image-delivery.mjs','_tools/native-image-delivery.mjs','_generator/test/native-image-delivery.test.mjs','docs/operations/native-image-task-delivery.md'],'tier':'A','tests':['_generator/test/native-image-delivery.test.mjs','_generator/test/image-execution.test.mjs','_generator/test/image-quality-gate.test.mjs']})
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Run targeted delivery and image guards
        run: |
          set -euo pipefail
          node --test _generator/test/native-image-delivery.test.mjs _generator/test/image-execution.test.mjs _generator/test/image-quality-gate.test.mjs | tee /tmp/native-delivery-proof/targeted.log
      - name: Run full tests and contracts
        run: |
          set -euo pipefail
          node --test _generator/test/*.test.mjs | tee /tmp/native-delivery-proof/full.log
          node _tools/validate-contracts.mjs | tee /tmp/native-delivery-proof/contracts.log
          node _tools/select-tests.mjs --changed-files '_generator/lib/native-image-delivery.mjs;_tools/native-image-delivery.mjs' > /tmp/native-delivery-proof/test-routing.json
      - name: Commit only coordinated documents and remove development helper
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$GITHUB_REF_NAME | cut -f1)" = "$GITHUB_SHA"
          git diff --name-only > /tmp/native-delivery-proof/changed-generated-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          actual=set(Path('/tmp/native-delivery-proof/changed-generated-paths.txt').read_text().splitlines())
          assert actual=={'docs/operations/START-HERE.md','docs/operations/LIVING-SYSTEM-OPERATIONS.md','docs/operations/automated-image-execution.md','_generator/test-selection.json'}, actual
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/START-HERE.md docs/operations/LIVING-SYSTEM-OPERATIONS.md docs/operations/automated-image-execution.md _generator/test-selection.json
          git rm .github/workflows/native-image-delivery-development-check.yml
          git commit -m 'Reconcile native image delivery operating documents and targeted-test routing'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > /tmp/native-delivery-proof/implementation-commit.txt
          git diff --stat e21634590350f2b07e50a5b69d7a7fe3fb9c1908 HEAD > /tmp/native-delivery-proof/final-diff-stat.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-image-delivery-implementation-proof
          path: /tmp/native-delivery-proof/
          retention-days: 14
          if-no-files-found: error
