name: Post-editorial deterministic publication

on:
  workflow_dispatch:
    inputs:
      staging_ref:
        description: Existing non-main branch containing the approved editorial kernel and deterministic inputs
        required: true
        type: string
      publication_manifest_path:
        description: Versioned publication manifest path committed on the handoff branch
        required: false
        default: _records/editorial-handoff/publication-manifest.json
        type: string
      kernel_path:
        description: Deprecated compatibility input; ignored because the handoff manifest is authoritative
        required: false
        type: string
      facts_path:
        description: Deprecated compatibility input; ignored because the handoff manifest is authoritative
        required: false
        type: string
      images_path:
        description: Deprecated compatibility input; ignored because the handoff manifest is authoritative
        required: false
        type: string
      media_path:
        description: Deprecated compatibility input; ignored because the handoff manifest is authoritative
        required: false
        type: string
      coverage_period:
        description: Deprecated compatibility input; ignored because the handoff manifest is authoritative
        required: false
        type: string

  push:
    branches: ['editorial-handoff/**']
    paths:
      - '_records/editorial-handoff/handoff.json'
      - 'briefs/images/**'

  workflow_run:
    workflows: ["Deterministic publication CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: post-editorial-${{ github.event_name == 'push' && github.ref_name || inputs.staging_ref }}
  cancel-in-progress: false

jobs:
  expand-validate-stage:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse direct-main operation
        env:
          STAGING_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.staging_ref }}
        run: |
          set -euo pipefail
          if [ "$STAGING_REF" = "main" ] || [ "$STAGING_REF" = "refs/heads/main" ]; then
            echo "Direct-main post-editorial operation is prohibited."
            exit 1
          fi
          if [[ "$STAGING_REF" == *".."* ]] || [[ "$STAGING_REF" == /* ]]; then
            echo "Unsafe staging ref."
            exit 1
          fi

      - name: Check out staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.staging_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Resolve editorial handoff inputs
        id: handoff
        env:
          STAGING_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.staging_ref }}
        run: |
          set -euo pipefail
          handoff="_records/editorial-handoff/handoff.json"
          if [ ! -f "$handoff" ]; then
            echo "Required editorial handoff manifest is missing: $handoff"
            exit 1
          fi
          node - "$handoff" "$STAGING_REF" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('fs');
          const [manifestPath,stagingRef,outputPath]=process.argv.slice(2);
          const m=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const required=['schema_version','execution_mode','staging_ref','kernel_path','facts_path','images_path','media_path','metadata_candidates_path','article_evidence_path','publication_manifest_path','image_transport_method','coverage_period','editorial_model_passes','post_editorial_model_passes','deterministic_validation_model_calls'];
          for(const key of required) if(!(key in m)) throw new Error('handoff_manifest_missing_'+key);
          if(m.staging_ref!==stagingRef) throw new Error('handoff_manifest_staging_ref_mismatch');
          if(!['production','qualification_nonproduction'].includes(m.execution_mode)) throw new Error('handoff_manifest_execution_mode_invalid');
          if(m.execution_mode==='production'&&!stagingRef.startsWith('editorial-handoff/production/')) throw new Error('production_handoff_branch_prefix_required');
          if(m.execution_mode==='qualification_nonproduction'&&!stagingRef.startsWith('editorial-handoff/qualification/')) throw new Error('qualification_handoff_branch_prefix_required');
          if(m.editorial_model_passes!==1) throw new Error('handoff_manifest_editorial_pass_count_invalid');
          if(m.post_editorial_model_passes!==0) throw new Error('handoff_manifest_post_editorial_pass_count_invalid');
          if(m.deterministic_validation_model_calls!==0) throw new Error('handoff_manifest_validation_model_calls_invalid');
          if(m.image_transport_method!=='github_git_data_api') throw new Error('handoff_manifest_git_data_image_transport_required');
          for(const key of ['kernel_path','facts_path','images_path','media_path','metadata_candidates_path','article_evidence_path','publication_manifest_path','coverage_period']){
            if(typeof m[key]!=='string'||m[key].includes('\n')||m[key].includes('\r')) throw new Error('handoff_manifest_invalid_'+key);
          }
          fs.appendFileSync(outputPath,
            'kernel_path='+m.kernel_path+'\n'+
            'facts_path='+m.facts_path+'\n'+
            'images_path='+m.images_path+'\n'+
            'media_path='+m.media_path+'\n'+
            'metadata_candidates_path='+m.metadata_candidates_path+'\n'+
            'article_evidence_path='+m.article_evidence_path+'\n'+
            'publication_manifest_path='+m.publication_manifest_path+'\n'+
            'image_transport_method='+m.image_transport_method+'\n'+
            'coverage_period='+m.coverage_period+'\n'+
            'execution_mode='+m.execution_mode+'\n');
          NODE

      - name: Validate repository-relative inputs
        env:
          KERNEL_PATH: ${{ steps.handoff.outputs.kernel_path }}
          FACTS_PATH: ${{ steps.handoff.outputs.facts_path }}
          IMAGES_PATH: ${{ steps.handoff.outputs.images_path }}
          MEDIA_PATH: ${{ steps.handoff.outputs.media_path }}
          METADATA_CANDIDATES_PATH: ${{ steps.handoff.outputs.metadata_candidates_path }}
          ARTICLE_EVIDENCE_PATH: ${{ steps.handoff.outputs.article_evidence_path }}
          PUBLICATION_MANIFEST_PATH: ${{ steps.handoff.outputs.publication_manifest_path }}
        run: |
          set -euo pipefail
          for p in "$KERNEL_PATH" "$FACTS_PATH" "$METADATA_CANDIDATES_PATH" "$ARTICLE_EVIDENCE_PATH" "$PUBLICATION_MANIFEST_PATH"; do
            if [ -z "$p" ] || [[ "$p" == /* ]] || [[ "$p" == *".."* ]] || [ ! -f "$p" ]; then
              echo "Invalid or missing repository-relative input: $p"
              exit 1
            fi
          done
          for p in "$IMAGES_PATH" "$MEDIA_PATH"; do
            if [ -n "$p" ] && { [[ "$p" == /* ]] || [[ "$p" == *".."* ]] || [ ! -f "$p" ]; }; then
              echo "Invalid optional repository-relative input: $p"
              exit 1
            fi
          done

      - name: Validate bounded metadata candidate gate
        env:
          METADATA_CANDIDATES_PATH: ${{ steps.handoff.outputs.metadata_candidates_path }}
        run: |
          set -euo pipefail
          node - "$METADATA_CANDIDATES_PATH" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2];
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.profile_id!=='under80-v1') throw new Error('metadata_gate_profile_mismatch');
          if(d.gate!=='metadata_prefilter_before_model_exposure') throw new Error('metadata_gate_identity_mismatch');
          if(!Number.isInteger(d.metadata_candidate_limit)||d.metadata_candidate_limit<1||d.metadata_candidate_limit>20) throw new Error('metadata_gate_limit_invalid');
          if(!Array.isArray(d.candidates)||d.candidates.length>20) throw new Error('metadata_gate_candidate_count_exceeded');
          if(d.retained_metadata_candidates!==d.candidates.length) throw new Error('metadata_gate_count_mismatch');
          if(d.coverage_ready!==true) throw new Error('metadata_gate_coverage_not_ready');
          if(!d.coverage_counts||!['technical_ai_engineering','applied_genai_knowledge_workers','agents_non_technical_people'].every(k=>Number.isInteger(d.coverage_counts[k])&&d.coverage_counts[k]>=3)) throw new Error('metadata_gate_focus_coverage_invalid');
          if(!Number.isInteger(d.agent_skill_story_ready_signals)||d.agent_skill_story_ready_signals<1) throw new Error('metadata_gate_agent_skill_story_ready_signal_missing');
          if(d.candidates.some(x=>x.date_status!=='resolved_metadata_date'||!x.metadata_event_at)) throw new Error('metadata_gate_unresolved_date_present');
          NODE

      - name: Validate precomputed article evidence packet
        env:
          ARTICLE_EVIDENCE_PATH: ${{ steps.handoff.outputs.article_evidence_path }}
          KERNEL_PATH: ${{ steps.handoff.outputs.kernel_path }}
        run: |
          set -euo pipefail
          node - "$ARTICLE_EVIDENCE_PATH" "$KERNEL_PATH" <<'NODE'
          const fs=require('fs');
          const [evidencePath,kernelPath]=process.argv.slice(2);
          const e=JSON.parse(fs.readFileSync(evidencePath,'utf8'));
          const k=JSON.parse(fs.readFileSync(kernelPath,'utf8'));
          if(e.profile_id!=='under80-v1'||e.execution_owner!=='github_actions'||e.model_calls!==0) throw new Error('article_evidence_provenance_invalid');
          if(e.review_plan_count!==9||!Array.isArray(e.model_visible)||e.model_visible.length!==9) throw new Error('article_evidence_review_plan_invalid');
          if(!Number.isInteger(e.model_visible_chars)||e.model_visible_chars>12000) throw new Error('article_evidence_char_limit_exceeded');
          const ids=new Set(e.model_visible.map(x=>x.candidate_id));
          for(const story of k.stories||[]) if(!ids.has(story.candidate_id)) throw new Error('selected_story_missing_from_precomputed_evidence:'+story.candidate_id);
          NODE

      - name: Resolve trusted main baseline and validate kernel
        id: baseline
        env:
          KERNEL_PATH: ${{ steps.handoff.outputs.kernel_path }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          baseline="$(git rev-parse origin/main)"
          kernel_baseline="$(node -e "const fs=require('fs');const k=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(k.baseline_sha||''));" "$KERNEL_PATH")"
          if [ "$kernel_baseline" != "$baseline" ]; then
            echo "Editorial kernel baseline does not match trusted origin/main."
            echo "kernel baseline: $kernel_baseline"
            echo "trusted main:    $baseline"
            exit 1
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
          node _tools/editorial-kernel.mjs validate --kernel "$KERNEL_PATH" --out /tmp/kernel-receipt.json

      - name: Validate and freeze versioned publication manifest
        id: publication_manifest
        env:
          PUBLICATION_MANIFEST_PATH: ${{ steps.handoff.outputs.publication_manifest_path }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          STAGING_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.staging_ref }}
        run: |
          set -euo pipefail
          date="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.env.PUBLICATION_MANIFEST_PATH,'utf8'));process.stdout.write(m.edition_date)")"
          node _tools/publication-manifest.mjs validate --manifest "$PUBLICATION_MANIFEST_PATH" --baseline "$BASELINE_SHA" --date "$date" --staging-ref "$STAGING_REF" --out /tmp/publication-manifest-validation.json
          node - "$PUBLICATION_MANIFEST_PATH" "_records/editorial-handoff/handoff.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('fs');
          const [manifestPath,handoffPath,outputPath]=process.argv.slice(2);
          const m=JSON.parse(fs.readFileSync(manifestPath,'utf8')),h=JSON.parse(fs.readFileSync(handoffPath,'utf8'));
          const artifact=name=>m.artifacts?.[name]?.path;
          const pairs=[['kernel_path','kernel'],['facts_path','facts'],['images_path','image_manifest'],['media_path','media'],['metadata_candidates_path','metadata_candidates'],['article_evidence_path','article_evidence']];
          for(const [handoffKey,artifactName] of pairs)if(h[handoffKey]!==artifact(artifactName))throw new Error('handoff_publication_manifest_path_mismatch:'+handoffKey);
          const values={
            image_manifest_path:artifact('image_manifest'),
            image_review_path:artifact('image_review'),
            media_path:artifact('media'),
            media_receipt_path:artifact('media_receipt'),
            watchlist_path:artifact('watchlist'),
            watchlist_evidence_path:artifact('watchlist_evidence'),
            public_watchlist_path:m.freeze?.watchlist?.public_projection_path||'',
            public_watchlist_digest:m.freeze?.watchlist?.public_projection_digest||''
          };
          for(const [key,value] of Object.entries(values)){if(!value)throw new Error('publication_manifest_output_missing:'+key);fs.appendFileSync(outputPath,key+'='+value+'\n');}
          NODE

      - name: Resolve durable recovery checkpoint
        id: recovery
        env:
          KERNEL_PATH: ${{ steps.handoff.outputs.kernel_path }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          date="$(node -e "const fs=require('fs');const k=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(k.brief_date||''));" "$KERNEL_PATH")"
          decision="$(node _tools/run-state.mjs resolve --date "$date" --baseline "$BASELINE_SHA" --contract "under80-v1/sep24-reliability-v1")"
          printf '%s\n' "$decision" > /tmp/recovery-decision.json
          reuse_images="$(printf '%s' "$decision" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.stdout.write((x.preserved_stages||[]).includes('IMAGES_READY')?'true':'false')})")"
          reuse_expansion="$(printf '%s' "$decision" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.stdout.write((x.preserved_stages||[]).includes('DETERMINISTIC_EXPANSION_READY')?'true':'false')})")"
          echo "reuse_images=$reuse_images" >> "$GITHUB_OUTPUT"
          echo "reuse_expansion=$reuse_expansion" >> "$GITHUB_OUTPUT"
          echo "Recovery checkpoint: images=$reuse_images expansion=$reuse_expansion"

      - name: Validate manifest-bound accepted image contracts
        env:
          KERNEL_PATH: ${{ steps.handoff.outputs.kernel_path }}
          IMAGE_MANIFEST_PATH: ${{ steps.publication_manifest.outputs.image_manifest_path }}
          IMAGE_REVIEW_PATH: ${{ steps.publication_manifest.outputs.image_review_path }}
        run: |
          set -euo pipefail
          node _tools/validate-handoff-images.mjs --kernel "$KERNEL_PATH" --images "$IMAGE_MANIFEST_PATH"
          node _tools/validate-handoff-images.mjs --kernel "$KERNEL_PATH" --images "$IMAGE_REVIEW_PATH"
          echo "FINAL_IMAGE_REVIEW_PATH=$IMAGE_REVIEW_PATH" >> "$GITHUB_ENV"

      - name: Deterministically expand canonical edition
        if: steps.recovery.outputs.reuse_expansion != 'true'
        env:
          KERNEL_PATH: ${{ steps.handoff.outputs.kernel_path }}
          FACTS_PATH: ${{ steps.handoff.outputs.facts_path }}
          MEDIA_PATH: ${{ steps.publication_manifest.outputs.media_path }}
          METADATA_CANDIDATES_PATH: ${{ steps.handoff.outputs.metadata_candidates_path }}
          COVERAGE_PERIOD: ${{ steps.handoff.outputs.coverage_period }}
        run: |
          set -euo pipefail
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          args=(expand --kernel "$KERNEL_PATH" --facts "$FACTS_PATH" --metadata "$METADATA_CANDIDATES_PATH" --images "$IMAGE_REVIEW_PATH" --media "$MEDIA_PATH" --published-at "$published_at" --coverage "$COVERAGE_PERIOD" --out /tmp/staged-edition.json)
          node _tools/editorial-kernel.mjs "${args[@]}"
          echo "PUBLISHED_AT=$published_at" >> "$GITHUB_ENV"

      - name: Generate one atomic publication stage
        if: steps.recovery.outputs.reuse_expansion != 'true'
        env:
          DAB_QUALIFICATION_NONPRODUCTION: ${{ steps.handoff.outputs.execution_mode == 'qualification_nonproduction' && '1' || '0' }}
          PUBLICATION_MANIFEST_PATH: ${{ steps.handoff.outputs.publication_manifest_path }}
        run: |
          set -euo pipefail
          rm -rf /tmp/publication-stage
          args=(generate \
            --edition /tmp/staged-edition.json \
            --out /tmp/publication-stage \
            --baseline-sha "${{ steps.baseline.outputs.sha }}" \
            --observed-at "$PUBLISHED_AT" \
            --run-id "kernel-${GITHUB_RUN_ID}" \
            --publication-manifest "$PUBLICATION_MANIFEST_PATH")
          node _generator/cli.mjs "${args[@]}"

      - name: Apply deterministic stage to staging branch
        if: steps.recovery.outputs.reuse_expansion != 'true'
        env:
          DAB_QUALIFICATION_NONPRODUCTION: ${{ steps.handoff.outputs.execution_mode == 'qualification_nonproduction' && '1' || '0' }}
          IMAGES_PATH: ${{ steps.handoff.outputs.images_path }}
        run: |
          set -euo pipefail
          cp -a /tmp/publication-stage/. ./
          node --test _generator/test/publication-manifest.test.mjs _generator/test/under80-handoff-transport.test.mjs
          node _tools/validate-contracts.mjs
          node _generator/cli.mjs validate-repo --commit "$(git rev-parse HEAD)"
          node _generator/cli.mjs integration-check --image-review "$FINAL_IMAGE_REVIEW_PATH"

      - name: Run pre-PR publication-candidate lint
        if: steps.recovery.outputs.reuse_expansion != 'true'
        env:
          STAGING_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.staging_ref }}
        run: |
          set -euo pipefail
          node _tools/publication-candidate-lint.mjs --date "$(node -e "const k=require('./_records/editorial-handoff/kernel.json');process.stdout.write(k.brief_date)")" --manifest "${{ steps.handoff.outputs.publication_manifest_path }}"
          date="$(node -e "const k=require('./_records/editorial-handoff/kernel.json');process.stdout.write(k.brief_date)")"
          node _tools/run-state.mjs seed-candidate --date "$date" --baseline "${{ steps.baseline.outputs.sha }}" --current "$(git rev-parse HEAD)" --contract "under80-v1/sep24-reliability-v1"

      - name: Commit deterministic outputs to staging only
        if: steps.recovery.outputs.reuse_expansion != 'true'
        env:
          STAGING_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.staging_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .; then
            echo "No deterministic publication changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate post-editorial Daily AI Brief publication stage"
          git push origin "HEAD:$STAGING_REF"

      - name: Qualification mode production guard
        if: steps.handoff.outputs.execution_mode == 'qualification_nonproduction'
        run: |
          echo "Qualification-only handoff: deterministic checks may run on the isolated branch, but no publication PR, label, merge, Pages deployment, or production promotion is authorized."

      - name: Open or reuse reviewable publication PR; never bypass required gates
        if: steps.handoff.outputs.execution_mode == 'production'
        env:
          STAGING_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.staging_ref }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const head=process.env.STAGING_REF;
            const ref=(await github.rest.git.getRef({...context.repo,ref:`heads/${head}`})).data;
            const candidateSha=ref.object.sha;
            const {data: prs}=await github.rest.pulls.list({...context.repo,head:`${context.repo.owner}:${head}`,base:'main',state:'all',per_page:100});
            let pr=prs.find(p=>p.state==='open');
            const prior=prs.find(p=>p.head.sha===candidateSha&&p.state==='closed');
            if(!pr&&prior){
              if(prior.merged_at){core.info(`Candidate ${candidateSha} already published by PR #${prior.number}; duplicate PR creation suppressed.`);return;}
              core.setFailed(`Candidate ${candidateSha} already has closed unmerged PR #${prior.number}; explicit recovery is required before creating another PR.`);return;
            }
            if(!pr){
              const created=await github.rest.pulls.create({...context.repo,head,base:'main',title:'Publish deterministic Daily AI Brief candidate',body:'Generated from one approved editorial kernel. Deterministic expansion, guarded visual selection, tests and contracts completed on the staging branch. Required main rules and human/editorial gates remain authoritative.'});
              pr=created.data;
            }
            pr=(await github.rest.pulls.get({...context.repo,pull_number:pr.number})).data;
            if(pr.head.sha!==candidateSha){core.setFailed(`PR head ${pr.head.sha} does not equal committed candidate ${candidateSha}`);return;}
            await github.rest.issues.addLabels({...context.repo,issue_number:pr.number,labels:['publication-candidate']}).catch(()=>{});
            core.info(`Publication PR #${pr.number} is bound to exact candidate ${candidateSha} and ready for required CI.`);

      - name: Build recovery decision after failure
        if: failure()
        env:
          KERNEL_PATH: ${{ steps.handoff.outputs.kernel_path }}
        run: |
          set +e
          date="$(node -e "const fs=require('fs');try{const k=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(k.brief_date||''));}catch{}" "$KERNEL_PATH")"
          if [ -n "$date" ]; then
            node _tools/run-state.mjs recover --date "$date" --root-error "post_editorial_workflow_failed" --out /tmp/recovery-decision.json
          fi
          set -e

      - name: Upload deterministic handoff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-editorial-evidence-${{ github.run_id }}
          path: |
            /tmp/kernel-receipt.json
            /tmp/visual-receipt.json
            /tmp/images.json
            /tmp/staged-edition.json
            /tmp/recovery-decision.json
          retention-days: 30
          if-no-files-found: warn

      - name: Record handoff summary
        if: always()
        run: |
          echo '### Post-editorial deterministic handoff' >> "$GITHUB_STEP_SUMMARY"
          echo '- Model calls in this workflow: **0**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Direct writes to main: **prohibited**' >> "$GITHUB_STEP_SUMMARY"
          echo "- Execution mode: **${{ steps.handoff.outputs.execution_mode }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.handoff.outputs.execution_mode }}" = "production" ]; then
            echo '- Protected publication PR: **required**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Protected publication PR: **prohibited for qualification_nonproduction**' >> "$GITHUB_STEP_SUMMARY"
            echo '- Production merge / Pages deployment: **prohibited**' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '- Visual path: deterministic only after Sep-17 parity + PNG integrity; otherwise story-scoped approved fallback' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/kernel-receipt.json 2>/dev/null || true
          cat /tmp/visual-receipt.json 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"


  promote-publication-candidate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Promote exact passing publication candidate through protected main
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const run = context.payload.workflow_run;
            const fullName = `${context.repo.owner}/${context.repo.repo}`;
            const {data: prs} = await github.rest.pulls.list({
              ...context.repo, state: 'open', base: 'main', per_page: 100
            });
            const pr = prs.find(p =>
              p.head.sha === run.head_sha &&
              p.head.repo?.full_name === fullName
            );
            if (!pr) {
              core.info(`No same-repository open PR matches successful CI head ${run.head_sha}; nothing to promote.`);
              return;
            }
            if (pr.draft) {
              core.info(`PR #${pr.number} is draft; automatic promotion is not eligible.`);
              return;
            }
            const labels = (pr.labels || []).map(x => typeof x === 'string' ? x : x.name);
            if (!labels.includes('publication-candidate')) {
              core.info(`PR #${pr.number} is not labeled publication-candidate; nothing to promote.`);
              return;
            }

            const policyResponse = await github.rest.repos.getContent({
              ...context.repo,
              path: 'docs/operations/efficiency-operating-policy.json',
              ref: 'main'
            });
            if (Array.isArray(policyResponse.data) || !policyResponse.data.content) {
              core.setFailed('Unable to read the current operating policy from main.');
              return;
            }
            const policy = JSON.parse(Buffer.from(policyResponse.data.content, 'base64').toString('utf8'));
            if (policy.profile_id !== 'under80-v1' || policy.autonomous_main_merge_enabled !== true) {
              core.info('Current main policy does not authorize under80 autonomous publication promotion.');
              return;
            }

            const refreshed = (await github.rest.pulls.get({...context.repo, pull_number: pr.number})).data;
            if (refreshed.head.sha !== run.head_sha || refreshed.base.ref !== 'main') {
              core.setFailed('Publication candidate moved after the successful required CI run.');
              return;
            }
            if (refreshed.mergeable === false || refreshed.mergeable_state === 'dirty') {
              core.setFailed(`PR #${pr.number} is not safely mergeable; protected publication remains held.`);
              return;
            }

            const result = await github.rest.pulls.merge({
              ...context.repo,
              pull_number: pr.number,
              sha: run.head_sha,
              merge_method: 'squash'
            });
            if (!result.data.merged) {
              core.setFailed(`GitHub protection denied publication promotion: ${result.data.message || 'merge not completed'}`);
              return;
            }
            core.info(`Protected publication PR #${pr.number} merged at ${result.data.sha}; Pages and deterministic post-deployment validation now own completion.`);
