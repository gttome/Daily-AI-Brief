name: Publish validated candidate
run-name: Publish candidate ${{ inputs.staging_ref }}
on:
  workflow_dispatch:
    inputs:
      staging_ref:
        description: Existing reviewed candidate branch; this workflow validates and opens a PR, never writes main
        required: true
        type: string
      dry_run:
        description: Validate without opening a pull request
        required: true
        default: true
        type: boolean
      autonomous_run:
        description: Continue a frozen active production run through protected CI and existing live closure
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  actions: write
  pages: write
  pull-requests: write
concurrency:
  group: daily-ai-brief-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate final candidate with trusted code
        env:
          STAGING_REF: ${{ inputs.staging_ref }}
        run: node _tools/check-candidate.mjs
      - name: Verify frozen active-run identity and closure evidence
        if: inputs.autonomous_run == true
        env:
          STAGING_REF: ${{ inputs.staging_ref }}
        run: node _tools/frozen-publication-guard.mjs
      - name: Build candidate site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./_candidate_site
          destination: ./_site-candidate
      - name: Open one reviewable publication PR
        if: inputs.dry_run == false
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          STAGING_REF: ${{ inputs.staging_ref }}
        with:
          script: |
            const head=process.env.STAGING_REF;
            const {data: prs}=await github.rest.pulls.list({...context.repo,head:`${context.repo.owner}:${head}`,base:'main',state:'open'});
            if(!prs.length)await github.rest.pulls.create({...context.repo,head,base:'main',title:'Publish validated Daily AI Brief candidate',body:'Complete candidate validated with trusted main code and Jekyll. Merge only after required CI passes for the exact head. No direct-main write is permitted.'});

      - name: Qualify and promote the exact frozen active candidate
        if: inputs.autonomous_run == true && inputs.dry_run == false
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const f=JSON.parse(require('fs').readFileSync('/tmp/frozen-publication.json','utf8'));
            const repo={...context.repo};
            const readMain=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({...repo,path,ref:'main'})).data.content,'base64').toString());
            const policy=await readMain('docs/operations/efficiency-operating-policy.json');
            if(policy.autonomous_main_merge_enabled!==true) throw Error('autonomous_promotion_not_authorized');
            const prs=(await github.rest.pulls.list({...repo,head:context.repo.owner+':'+f.branch,base:'main',state:'all',per_page:100})).data;
            let pr=prs.find(p=>p.head.sha===f.candidate_sha && p.state==='open');
            const merged=prs.find(p=>p.head.sha===f.candidate_sha && p.merged_at);
            if(merged) {
              await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'daily-delta-validation.yml',ref:'main',inputs:{date:f.edition_date,expected_sha:merged.merge_commit_sha}});
              return;
            }
            if(!pr) throw Error('exact_frozen_publication_pr_required');
            const runs=async()=> (await github.rest.actions.listWorkflowRuns({...repo,workflow_id:'ci.yml',branch:f.branch,per_page:100})).data.workflow_runs.filter(r=>r.head_sha===f.candidate_sha);
            let existing=await runs();
            if(!existing.some(r=>r.conclusion==='success'||r.status!=='completed'))
              await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'ci.yml',ref:f.branch});
            let passing=existing.find(r=>r.conclusion==='success');
            for(let i=0;!passing&&i<60;i++) {
              await new Promise(resolve=>setTimeout(resolve,10000));
              existing=await runs();
              passing=existing.find(r=>r.conclusion==='success');
              if(!passing && existing.length && existing.every(r=>r.status==='completed')) throw Error('frozen_candidate_ci_failed');
            }
            if(!passing) throw Error('frozen_candidate_ci_pending');
            const pointer=await readMain('data/operations/active-production-run.json');
            if(!pointer.active||pointer.terminal||pointer.execution_id!==f.execution_id||pointer.branch!==f.branch) throw Error('active_run_changed');
            const main=(await github.rest.git.getRef({...repo,ref:'heads/main'})).data.object.sha;
            if(main!==f.baseline_sha) throw Error('baseline_changed_revalidation_required');
            pr=(await github.rest.pulls.get({...repo,pull_number:pr.number})).data;
            if(pr.head.sha!==f.candidate_sha||pr.base.ref!=='main'||pr.draft||pr.head.repo.full_name!==context.repo.owner+'/'+context.repo.repo) throw Error('candidate_changed_after_ci');
            const result=(await github.rest.pulls.merge({...repo,pull_number:pr.number,sha:f.candidate_sha,merge_method:'squash'})).data;
            if(!result.merged) throw Error('protected_merge_denied');
            await github.request('POST /repos/{owner}/{repo}/pages/builds',repo);
            await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'daily-delta-validation.yml',ref:'main',inputs:{date:f.edition_date,expected_sha:result.sha}});
