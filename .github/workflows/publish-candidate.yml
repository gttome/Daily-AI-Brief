name: Publish validated candidate
on:
  workflow_dispatch:
    inputs:
      staging_ref:
        description: Existing reviewed candidate branch; this workflow validates and opens a PR, never writes main
        required: true
        type: string
      dry_run:
        description: Validate without opening a pull request
        required: true
        default: true
        type: boolean
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: daily-ai-brief-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate final candidate with trusted code
        env:
          STAGING_REF: ${{ inputs.staging_ref }}
        run: node _tools/check-candidate.mjs
      - name: Build candidate site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./_candidate_site
          destination: ./_site-candidate
      - name: Open one reviewable publication PR
        if: inputs.dry_run == false
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          STAGING_REF: ${{ inputs.staging_ref }}
        with:
          script: |
            const head=process.env.STAGING_REF;
            const {data: prs}=await github.rest.pulls.list({...context.repo,head:`${context.repo.owner}:${head}`,base:'main',state:'open'});
            if(!prs.length)await github.rest.pulls.create({...context.repo,head,base:'main',title:'Publish validated Daily AI Brief candidate',body:'Complete candidate validated with trusted main code and Jekyll. Merge only after required CI passes for the exact head. No direct-main write is permitted.'});
