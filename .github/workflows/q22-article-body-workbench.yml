name: Q22 article body fixture capture
on:
  push:
    branches: [hardening/q22-article-evidence-body-2026-09-28]
    paths: [.github/workflows/q22-article-body-workbench.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Reuse Q22 frozen evidence and terminal result
        run: |
          set -euo pipefail
          mkdir -p /tmp/q22-article-body
          git fetch --no-tags --depth=1 origin 4466d7f499b1848238bbe4594af4589d20d062f0
          git show 4466d7f499b1848238bbe4594af4589d20d062f0:_records/qualification/2026-09-28-Q22/result.json > /tmp/q22-article-body/q22-result.json
          git show 4466d7f499b1848238bbe4594af4589d20d062f0:_records/discovery-preflight/result/article-evidence.json > /tmp/q22-article-body/q22-article-evidence.json
          git show 4466d7f499b1848238bbe4594af4589d20d062f0:_records/discovery-preflight/result/metadata-candidates.json > /tmp/q22-article-body/q22-metadata.json
      - name: Capture the two demonstrated failed sources only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {retrieveSource,compactDiscoveryHtml,cleanText} from './_tools/discovery-links.mjs';
          const root='/tmp/q22-article-body';
          const frozen=JSON.parse(fs.readFileSync(root+'/q22-article-evidence.json','utf8'));
          const report={scope:'parser fixture capture, not a Q rerun',source_q:'2026-09-28-Q22',captured_at:new Date().toISOString(),model_calls:0,production_mutation:false,items:[]};
          for(const id of ['m05','m06']){
            const candidate=frozen.model_visible.find(x=>x.candidate_id===id);
            if(!candidate||new URL(candidate.canonical_url).hostname!=='techcommunity.microsoft.com')throw Error('Unexpected source');
            try{
              const r=await retrieveSource(candidate.canonical_url,{maxResponseBytes:1800000,maxNormalizedChars:1500000});
              fs.writeFileSync(root+'/'+id+'.html',r.text);
              const compact=compactDiscoveryHtml(r.text),plain=cleanText(compact);
              const structured=[...r.text.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)].map(m=>({attributes:m[1].slice(0,300),chars:m[2].length,articleBody:m[2].includes('articleBody'),nextData:/__NEXT_DATA__/.test(m[1]),flight:/self\.__next_f/.test(m[2])}));
              report.items.push({candidate_id:id,url:candidate.canonical_url,response_url:r.url,response_bytes:r.response_bytes,sha256:crypto.createHash('sha256').update(r.text).digest('hex'),plain_word_count:plain.split(/\s+/).filter(Boolean).length,plain_excerpt:plain.slice(0,1000),scripts:structured,article_elements:(r.text.match(/<article\b/gi)||[]).length,main_elements:(r.text.match(/<main\b/gi)||[]).length,attempts:r.attempts});
            }catch(e){report.items.push({candidate_id:id,url:candidate.canonical_url,error:String(e.message),attempts:e.attempts||[]});}
          }
          fs.writeFileSync(root+'/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q22-article-body-fixtures
          path: /tmp/q22-article-body/
          retention-days: 14
          if-no-files-found: error
