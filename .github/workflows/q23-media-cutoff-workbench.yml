name: Q23 media cutoff correction verification
on:
  push:
    branches: ['hardening/q23-media-research-cutoff-2026-09-28']
    paths: ['.github/workflows/q23-media-cutoff-workbench.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Apply reviewed replacements only against unchanged released file bases
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin cad5da83752a36b6bd59f26e0800bbde7c7f7ef3
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          base='cad5da83752a36b6bd59f26e0800bbde7c7f7ef3'
          targets=['_generator/lib/media-selection.mjs','_generator/lib/validate.mjs','_generator/lib/editorial-kernel.mjs','_contracts/v1/edition.schema.json','docs/operations/under80-runtime-contract.json','docs/operations/continuous-qualification-contract.json','docs/operations/START-HERE.md','docs/operations/LIVING-SYSTEM-OPERATIONS.md']
          for filename in targets:
              actual=subprocess.check_output(['git','hash-object',filename],text=True).strip()
              expected=subprocess.check_output(['git','rev-parse',base+':'+filename],text=True).strip()
              assert actual==expected, filename+': concurrent change or repeated patch'
          def replace(text,old,new,count=1):
              assert text.count(old)==count,(old,text.count(old))
              return text.replace(old,new)
          imports="import {MEDIA_FRESHNESS_POLICY,mediaReferenceTime,mediaPublicationTime} from './media-freshness.mjs';\n"
          p=Path(targets[0]);s=p.read_text();s=imports+s
          s=replace(s,'function eligibleVideos(candidates,slot,date){','function eligibleVideos(candidates,slot,date,options={}){\n const reference=options.policy==null&&options.cutoff==null?Date.parse(date):mediaReferenceTime({date,...options});')
          s=replace(s,'const hours=ageDays(date,c.upload_date)*24;','const hours=(reference-mediaPublicationTime(c.upload_date,options.policy))/3600000;')
          s=replace(s,'export function selectVideo(candidates,slot,date){','export function selectVideo(candidates,slot,date,options={}){')
          s=replace(s,'const eligible=eligibleVideos(candidates,slot,date);','const eligible=eligibleVideos(candidates,slot,date,options);')
          s=replace(s,'{deepReviewedIds=[],date=null}={}','{deepReviewedIds=[],date=null,cutoff=null,policy=null}={}')
          s=replace(s,' const metadata=candidates.filter',' if(policy!=null||cutoff!=null)mediaReferenceTime({date,cutoff,policy});\n const metadata=candidates.filter')
          s=replace(s,'eligibleVideos([c],c.slot,date).length','eligibleVideos([c],c.slot,date,{cutoff,policy}).length')
          s=replace(s,'function podcastTier(candidate,date){\n const age=ageDays(date,candidate.publication_date);','function podcastTier(candidate,reference,policy=null){\n const age=(reference-mediaPublicationTime(candidate.publication_date,policy))/86400000;')
          s=replace(s,"{date,limit=2,restrictedShow='The AI Daily Brief'}={}","{date,cutoff=null,policy=null,limit=2,restrictedShow='The AI Daily Brief'}={}")
          s=replace(s," if(limit!==2)throw Error('Daily podcast target is exactly two when two qualifying selections exist');"," const reference=mediaReferenceTime({date,cutoff,policy});\n if(limit!==2)throw Error('Daily podcast target is exactly two when two qualifying selections exist');")
          s=replace(s,'podcastTier(c,date)','podcastTier(c,reference,policy)',2)
          s=replace(s,'return {selected,target:2,','return {...(policy?{media_freshness_policy:policy,research_cutoff_at:cutoff}:{}),selected,target:2,')
          p.write_text(s)
          p=Path(targets[1]);s=imports+p.read_text()
          s=replace(s,'  const cutoff=time(edition.research_cutoff_at);','  const cutoff=time(edition.research_cutoff_at);\n  const mediaPolicy=edition.media_freshness_policy??null;\n  const currentMediaPolicy=mediaPolicy===MEDIA_FRESHNESS_POLICY;\n  let mediaReference=Date.parse(edition.brief_date);\n  if(mediaPolicy!=null){\n    try{mediaReference=mediaReferenceTime({date:edition.brief_date,cutoff:edition.research_cutoff_at,policy:mediaPolicy});}\n    catch(error){mediaReference=NaN;errors.push(String(error.message));}\n  }')
          s=replace(s,'(Date.parse(edition.brief_date)-Date.parse(video.upload_date))/3600000','(mediaReference-mediaPublicationTime(video.upload_date,currentMediaPolicy?MEDIA_FRESHNESS_POLICY:null))/3600000')
          s=replace(s,'(Date.parse(edition.brief_date)-Date.parse(podcast.publication_date))/86400000','(mediaReference-mediaPublicationTime(podcast.publication_date,currentMediaPolicy?MEDIA_FRESHNESS_POLICY:null))/86400000')
          p.write_text(s)
          p=Path(targets[2]);s=imports+p.read_text()
          s=replace(s," const errors=[];"," const errors=[];\n if(kernel?.media_freshness_policy!=null&&kernel.media_freshness_policy!==MEDIA_FRESHNESS_POLICY)errors.push('unknown_media_freshness_policy');")
          s=replace(s,' const metadataById=new Map',' if(normalized.media_freshness_policy!=null)mediaReferenceTime({date:normalized.brief_date,cutoff:researchCutoffAt,policy:normalized.media_freshness_policy});\n const metadataById=new Map')
          s=replace(s," const base={schema_version:'1.0.0',"," const base={schema_version:'1.0.0',...(normalized.media_freshness_policy?{media_freshness_policy:normalized.media_freshness_policy}:{}),")
          p.write_text(s)
          policy='media-research-cutoff-v1'
          p=Path(targets[3]);j=json.loads(p.read_text());assert 'media_freshness_policy' not in j['properties'];j['properties']['media_freshness_policy']={'type':'string','enum':[policy]};p.write_text(json.dumps(j,indent=2,ensure_ascii=False)+'\n')
          p=Path(targets[4]);j=json.loads(p.read_text());j['schema_version']='1.9.0';j['media_freshness']={'policy_id':policy,'reference':'recorded research_cutoff_at, never edition-date midnight or execution wall clock','new_run_policy_identity_required':True,'original_publication_timestamps_preserved':True,'explicit_timestamp_and_timezone_required':True,'video_max_age_hours':72,'podcast_primary_hours':48,'podcast_fallback_hours':168,'podcast_exception_hours':720,'historical_missing_policy':'retain legacy edition-date reference; do not relabel historical Q outcomes','age_duration_diversity_quality_limits_changed':False,'selection_api':'Pass date, cutoff and policy explicitly to selectPodcasts; pass cutoff/policy options to selectVideo. Carry media_freshness_policy on the kernel into the canonical edition.'};p.write_text(json.dumps(j,indent=2,ensure_ascii=False)+'\n')
          p=Path(targets[5]);j=json.loads(p.read_text());j['schema_version']='1.13.0';j['fresh_run_requirements']['media_freshness_policy']=policy;j['media_cutoff_correction']={'source_q':'2026-09-28-Q23','failure_code':'qualification_media_freshness_uses_midnight_not_cutoff','terminal_result_preserved':True,'new_request_semantic_and_kernel_policy_identity_required':True,'cutoff_source':'original fresh-run request; same reference for selection and canonical validation','same_day_pre_cutoff_media_eligible':True,'after_cutoff_media_ineligible':True,'historical_missing_policy_unchanged':True,'media_limits_unchanged':True};p.write_text(json.dumps(j,indent=2,ensure_ascii=False)+'\n')
          amendment='''
          ## September 28, 2026 — Q23 media reference-time correction

          > [!IMPORTANT]
          > Q23 is terminal FAIL at MEDIA_READY, preserved at `cd940858dee9bb5a4c5e6d84cf2a7dbf47b4618d`. Its article preflight and one semantic selection passed and remain unchanged. This correction is not released until protected CI passes on the actual final head and normal merge completes. Never resume or refill Q23 into PASS.

          **Demonstrated defect:** workflow 36474976174 used publisher-verified Everyday AI episode 871 metadata: publication `2026-09-28T11:00:00Z`, duration 1,853 seconds, Q23 cutoff `2026-09-28T19:10:36Z`. The old selector rejected that 8.18-hour-old candidate because it used UTC midnight. Both video and podcast edition-validation paths contained the same reference-time error. No source timestamp was changed to make it pass.

          **Versioned correction:** `media-research-cutoff-v1` uses the original recorded research cutoff for selection and canonical edition validation. New run requests, semantic receipts and kernels must carry `media_freshness_policy`; kernel expansion retains it. Selectors receive the original cutoff and policy explicitly. Unknown policies, missing or timezone-free cutoffs, unresolved source dates and future sources fail closed. Historical artifacts without the field retain their recorded legacy interpretation. The metadata gate remains the authoritative cutoff source; execution time does not extend it.

          | Existing limit | Unchanged value |
          |---|---|
          | Videos | Exactly two; maximum age 72 hours; preferred duration <=10 minutes, fallback <=15, last resort <=20 |
          | Podcasts | Exactly two source-diverse selections; 48-hour primary, 7-day fallback and documented 30-day exception |
          | Evidence | Verified identity, original timestamp, exact runtime and reviewed source support; metadata capture is not editorial approval |
          | Other gates | Six stories, 2/2/2, one reusable Agent Skills story, nine article packets, 12,000 characters, novelty, professional images and nonproduction isolation |

          **Verified source-resolution lesson:** the stale Everyday AI WordPress feed is not evidence that the podcast has no recent episodes. Publisher-distributed Apple episode pages bind episode ID, show ID, GUID, exact release time and exact runtime. Saved-page artifact 10991834733 plus metadata-verification artifact 10992499980 provide three independently extracted records: Everyday AI 871 (September 28, 11:00 UTC, 30:53), Practical AI 373 (September 24, 09:00 UTC, 48:52), and AI for Humans 197 (September 24, 10:00 UTC, 48:21). Practical AI also supplies an episode page and transcript. These are metadata-qualified candidates, not selected media or reusable approval for a later Q. Preserve source hashes and review/novelty limitations. No oversized feed limit was raised.

          **YouTube diagnostic correction:** offline inspection of the three saved IBM-linked responses found LOGIN_REQUIRED / bot challenges with absent videoDetails. They are access challenges, not confirmed identity mismatches. Retain the original observations and append this diagnosis; do not retry or bypass challenges, invent dates/runtimes, or claim zero qualifying videos exist. Video selections remain unresolved.

          **Acceptance and continuation:** run new same-day/future/boundary/historical/kernel-round-trip tests, the full suite and protected CI; include contracts and these living-document amendments in the same PR; remove the temporary workbench. After normal merge, resolve live refs and start the next unused Q from actual merged main and an observed fresh cutoff. Require matching execution evidence. Preserve PR281/PR282, terminal Q/IH records, PR117, published content, the separate greenfield repository and Sites. No Work, Codex or paid-model API is authorized; billing is unobserved.

          ---
          '''
          amendment='\n'.join(line[10:] if line.startswith('          ') else line for line in amendment.splitlines())+'\n'
          for filename in targets[6:]:
              p=Path(filename);b=p.read_bytes();first,rest=b.split(b'\n',1);p.write_bytes(first+b'\n'+amendment.encode()+rest)
          Path('/tmp/q23-cutoff-verification').mkdir(exist_ok=True)
          Path('/tmp/q23-cutoff-verification/expected-paths.json').write_text(json.dumps(targets))
          print('Reviewed patch applied to eight exact released bases. No historical/public artifacts modified.')
          PY
      - name: Run targeted regression tests and complete deterministic validation
        run: |
          set -euo pipefail
          node --test _generator/test/media-research-cutoff.test.mjs 2>&1 | tee /tmp/q23-cutoff-verification/targeted.log
          npm test 2>&1 | tee /tmp/q23-cutoff-verification/full-tests.log
          npm run validate 2>&1 | tee /tmp/q23-cutoff-verification/repository-validation.log
      - name: Persist only the approved corrective change set
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$GITHUB_REF_NAME | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,subprocess
          expected=set(json.load(open('/tmp/q23-cutoff-verification/expected-paths.json')))
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          subprocess.check_call(['git','add',*sorted(expected)])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use versioned media research cutoff throughout selection and validation'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > /tmp/q23-cutoff-verification/verified-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q23-media-cutoff-correction-verification
          path: /tmp/q23-cutoff-verification/
          retention-days: 14
          if-no-files-found: error
