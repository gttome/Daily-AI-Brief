name: Q24 fresh podcast evidence and cutoff validation
on:
  push:
    branches: ['editorial-handoff/qualification/2026-09-28-Q24']
    paths: ['.github/workflows/q24-podcast-evidence.yml']
permissions:
  contents: write
jobs:
  capture-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Freeze Q24 inputs and capture three fresh publisher-distributed episode pages
        run: |
          set -euo pipefail
          test "$(git hash-object _records/discovery-preflight/result/article-evidence.json)" = 'ce5caea8a690b2a92b1298f5f0e7cf85fa97d7df'
          test "$(git hash-object _records/qualification/2026-09-28-Q24/semantic-receipt.json)" = 'fc459b45af230f8b3d9142a7f951510b9a8475f7'
          test ! -f _records/qualification/2026-09-28-Q24/result.json
          test ! -f _records/qualification/2026-09-28-Q24/media-evidence/podcast-metadata.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {retrieveSource} from './_tools/discovery-links.mjs';
          const root='/tmp/q24-podcast-evidence';fs.mkdirSync(root,{recursive:true});
          const sources=[
            ['everyday-871','1000792012779','1683401861','https://podcasts.apple.com/us/podcast/ep-871-desktop-agent-lingo-simplified-goals-loops-plans/id1683401861?i=1000792012779'],
            ['practical-373','1000791431612','1406537385','https://podcasts.apple.com/us/podcast/from-agents-md-to-enterprise-deployment/id1406537385?i=1000791431612'],
            ['ai-for-humans-197','1000791443406','1682409647','https://podcasts.apple.com/us/podcast/opus-5-5-is-our-favorite-ai-model-so-far/id1682409647?i=1000791443406']
          ],observations=[];
          for(const [id,episode_id,show_id,url] of sources){
            try{
              const r=await retrieveSource(url,{maxResponseBytes:1800000,maxNormalizedChars:1500000});
              fs.writeFileSync(root+'/'+id+'.html',r.text,{flag:'wx'});
              observations.push({id,episode_id,show_id,url,resolved_url:r.url,status:'retrieved',checked_at:new Date().toISOString(),source_sha256:crypto.createHash('sha256').update(r.text).digest('hex')});
            }catch(e){observations.push({id,episode_id,show_id,url,status:'unavailable',checked_at:new Date().toISOString(),reason:String(e.message)});}
          }
          fs.writeFileSync(root+'/observations.json',JSON.stringify(observations,null,2)+'\n');
          NODE
      - name: Bind metadata to matching episode and show identities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,hashlib
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.active=False; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script' and dict(attrs).get('id')=='serialized-server-data': self.active=True
              def handle_endtag(self,tag):
                  if tag=='script': self.active=False
              def handle_data(self,data):
                  if self.active: self.parts.append(data)
          root=Path('/tmp/q24-podcast-evidence');observations=json.loads((root/'observations.json').read_text());records=[];diagnostics=[]
          for observation in observations:
              if observation['status']!='retrieved': diagnostics.append(observation);continue
              try:
                  data=(root/(observation['id']+'.html')).read_bytes()
                  assert hashlib.sha256(data).hexdigest()==observation['source_sha256']
                  parser=Scripts();parser.feed(data.decode('utf8'));doc=json.loads(''.join(parser.parts));header=doc['data'][0]['data']['shelves'][0]['items'][0];offer=header['contextAction']['episodeOffer']
                  assert str(header['adamId'])==str(offer['contentId'])==observation['episode_id']
                  assert str(offer['showOffer']['adamId'])==observation['show_id']
                  assert header['duration']==offer['duration'] and isinstance(offer['duration'],int) and offer['duration']>0
                  assert header['releaseDate']==offer['releaseDate']
                  assert ('id'+observation['show_id']) in offer['storeUrl'] and ('i='+observation['episode_id']) in offer['storeUrl']
                  records.append({'candidate_id':observation['id'],'kind':'podcast','canonical_url':offer['storeUrl'],'title':offer['title'],'show':offer['showOffer']['title'],'episode_id':observation['episode_id'],'show_id':observation['show_id'],'episode_guid':offer['guid'],'feed_url':offer['showOffer']['feedUrl'],'published_at':offer['releaseDate'],'runtime_seconds':offer['duration'],'source_sha256':observation['source_sha256'],'checked_at':observation['checked_at'],'metadata_identity_verified':True,'editorial_review_complete':False})
              except (ValueError,KeyError,TypeError,AssertionError,IndexError) as error: diagnostics.append({'candidate_id':observation['id'],'status':'metadata_unresolved','reason':type(error).__name__+': '+str(error)})
          (root/'metadata.json').write_text(json.dumps({'records':records,'diagnostics':diagnostics},indent=2)+'\n')
          PY
      - name: Apply released cutoff policy and screen prior production identities
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {MEDIA_FRESHNESS_POLICY,mediaReferenceTime,mediaPublicationTime} from './_generator/lib/media-freshness.mjs';
          const runId='2026-09-28-Q24',root='_records/qualification/'+runId,request=JSON.parse(fs.readFileSync('_records/discovery-preflight/request.json','utf8'));
          const semantic=JSON.parse(fs.readFileSync(root+'/semantic-receipt.json','utf8'));
          if(request.qualification_run_id!==runId||request.media_freshness_policy!==MEDIA_FRESHNESS_POLICY||semantic.media_freshness_policy!==MEDIA_FRESHNESS_POLICY||semantic.cutoff!==request.cutoff)throw Error('Q24_cutoff_or_policy_identity_invalid');
          const reference=mediaReferenceTime({date:request.edition_date,cutoff:request.cutoff,policy:request.media_freshness_policy});
          const data=JSON.parse(fs.readFileSync('/tmp/q24-podcast-evidence/metadata.json','utf8'));
          const identity=value=>{try{const u=new URL(value);if(u.hostname==='podcasts.apple.com'&&u.searchParams.get('i'))return 'apple-episode:'+u.searchParams.get('i');for(const k of [...u.searchParams.keys()])if(k.startsWith('utm_'))u.searchParams.delete(k);return u.origin+u.pathname.replace(/\/$/,'')+u.search;}catch{return null;}};
          const prior=[];
          for(const filename of fs.readdirSync('_data/editions').filter(x=>/^\d{4}-\d{2}-\d{2}\.json$/.test(x)&&x.slice(0,10)<request.edition_date)){
            const edition=JSON.parse(fs.readFileSync('_data/editions/'+filename,'utf8'));
            for(const item of [...(edition.podcasts||[]),...(edition.podcast?[edition.podcast]:[])])prior.push({edition_date:filename.slice(0,10),title:item.title,show:item.show,ids:[item.url,item.canonical_url,...(Array.isArray(item.platforms)?item.platforms:[]).map(x=>x.url)].map(identity).filter(Boolean)});
          }
          const records=data.records.map(record=>{
            const age=(reference-mediaPublicationTime(record.published_at,MEDIA_FRESHNESS_POLICY))/3600000;
            const matches=prior.filter(x=>x.ids.includes(identity(record.canonical_url))||(x.title&&x.title.trim().toLowerCase()===record.title.trim().toLowerCase()&&x.show===record.show));
            return {...record,age_hours_at_cutoff:Number.isFinite(age)?age:null,within_primary_or_seven_day_window:Number.isFinite(age)&&age>=0&&age<=168,freshness_tier:age>=0&&age<=48?'primary_48h':age>48&&age<=168?'fallback_7d':null,prior_production_identity_matches:matches,identity_novelty_screen_passed:matches.length===0,semantic_novelty_review_complete:false,selection_status:'metadata_verified_not_selected'};
          });
          const evidence={schema_version:'1.0.0',run_id:runId,cutoff:request.cutoff,baseline_sha:request.baseline_sha,media_freshness_policy:MEDIA_FRESHNESS_POLICY,workflow_run_id:Number(process.env.GITHUB_RUN_ID),model_calls:0,new_episode_page_retrievals:3,article_candidate_retrievals:0,prior_q_approval_reused:false,prior_attempt:{workflow_run_id:36477387128,result:'failed_before_source_retrieval',reason:'shallow_checkout_did_not_include_semantic_commit',article_stages_repeated:false,source_retrievals:0},records,diagnostics:data.diagnostics,media_ready:false,podcast_selection_complete:false,video_selection_complete:false,production_mutation:false};
          fs.mkdirSync(root+'/media-evidence',{recursive:true});
          fs.writeFileSync(root+'/media-evidence/podcast-metadata.json',JSON.stringify(evidence,null,2)+'\n',{flag:'wx'});
          console.log(JSON.stringify(evidence,null,2));
          NODE
      - name: Preserve completed article and semantic inputs and commit only new evidence
        run: |
          set -euo pipefail
          test "$(git hash-object _records/discovery-preflight/result/article-evidence.json)" = 'ce5caea8a690b2a92b1298f5f0e7cf85fa97d7df'
          test "$(git hash-object _records/qualification/2026-09-28-Q24/semantic-receipt.json)" = 'fc459b45af230f8b3d9142a7f951510b9a8475f7'
          test "$(git ls-remote origin refs/heads/$GITHUB_REF_NAME | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _records/qualification/2026-09-28-Q24/media-evidence/podcast-metadata.json
          git commit -m 'Preserve Q24 fresh podcast metadata using repaired cutoff and prior-production screen'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q24-fresh-podcast-evidence
          path: |
            /tmp/q24-podcast-evidence/
            _records/qualification/2026-09-28-Q24/media-evidence/
          retention-days: 14
          if-no-files-found: error
