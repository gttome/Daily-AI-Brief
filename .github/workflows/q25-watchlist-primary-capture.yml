name: Q25 emerging primary evidence
on:
  push:
    branches: ['editorial-handoff/qualification/2026-09-29-Q25']
    paths: ['.github/workflows/q25-watchlist-primary-capture.yml']
permissions:
  contents: write
concurrency:
  group: q25-media-writer
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Capture three original research abstracts for separate Watchlist review
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';import {retrieveSource} from './_tools/discovery-links.mjs';
          assert.equal(process.env.GITHUB_REF_NAME,'editorial-handoff/qualification/2026-09-29-Q25');const base='_records/qualification/2026-09-29-Q25',out=base+'/watchlist-book-evidence',raw=process.env.RUNNER_TEMP+'/q25-emerging-primary';assert(!fs.existsSync(base+'/result.json'));assert(!fs.existsSync(out+'/emerging-primary-capture.json'));fs.mkdirSync(raw,{recursive:true});fs.mkdirSync(out+'/source-texts',{recursive:true});
          const outcomes=[];for(const [id,url] of [['jev-ecosystem','https://arxiv.org/abs/2609.30216v1'],['harness-cost','https://arxiv.org/abs/2609.28919v1'],['potarcin','https://arxiv.org/abs/2609.27288v1']]){try{const r=await retrieveSource(url,{maxResponseBytes:800000,maxNormalizedChars:700000});fs.writeFileSync(raw+'/'+id+'.html',r.text,{flag:'wx'});const visible=r.text.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();fs.writeFileSync(out+'/source-texts/'+id+'.txt',visible,{flag:'wx'});outcomes.push({id,url,checked_at:new Date().toISOString(),status:'captured',source_sha256:crypto.createHash('sha256').update(r.text).digest('hex'),source_text_sha256:crypto.createHash('sha256').update(visible).digest('hex'),source_text_path:out+'/source-texts/'+id+'.txt',artifact_file:id+'.html'});}catch(e){outcomes.push({id,url,checked_at:new Date().toISOString(),status:'unavailable',reason:String(e.message)});}}
          const receipt={schema_version:'1.0.0',run_id:'2026-09-29-Q25',cutoff:'2026-09-29T14:09:00Z',baseline_sha:'49e43aa9a581866c487140b27400cc39e8531037',workflow_run_id:Number(process.env.GITHUB_RUN_ID),execution_commit:process.env.GITHUB_SHA,outcomes,scope:'Watchlist-only original abstract/date verification; no full-paper review, reproduction or changed article selection',new_retrievals:3,maximum_retrievals:3,editorial_review_complete:false,watchlist_ready:false,article_stages_repeated:false,media_stages_repeated:false,production_mutation:false,model_calls:0,work_invocations:0,codex_invocations:0,paid_model_api_calls:0,account_billing_observed:false};fs.writeFileSync(out+'/emerging-primary-capture.json',JSON.stringify(receipt,null,2)+'\n',{flag:'wx'});fs.writeFileSync(raw+'/receipt.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(outcomes));
          NODE
      - name: Persist new evidence only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _records/qualification/2026-09-29-Q25/watchlist-book-evidence/emerging-primary-capture.json _records/qualification/2026-09-29-Q25/watchlist-book-evidence/source-texts/
          git commit -m 'Persist three Q25 emerging primary abstract sources for review'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q25-emerging-primary
          path: ${{ runner.temp }}/q25-emerging-primary/
          retention-days: 14
          if-no-files-found: error
