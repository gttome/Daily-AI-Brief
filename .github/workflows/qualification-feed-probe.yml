name: Qualification source feed probe
on:
  push:
    branches: ['qualification-diagnostic/**']
    paths: ['_records/qualification-feed-probe/request.json']
permissions:
  contents: write
concurrency:
  group: qualification-source-feed-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Check and execute bounded probe
        run: |
          set -euo pipefail
          node --check _tools/qualification-feed-probe.mjs
          node _tools/qualification-feed-probe.mjs
      - name: Preserve probe report
        if: always()
        run: |
          set -euo pipefail
          id="${GITHUB_REF_NAME##*/}"
          [[ "$id" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-D[0-9]+$ ]]
          report="_records/qualification-feed-probe/$id/report.json"
          test -f "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -- "$report"
          if ! git diff --cached --quiet; then
            git commit -m "Preserve source feed probe $id"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
