name: Qualification semantic evidence gate

on:
  push:
    branches: ['editorial-handoff/qualification/**']
    paths:
      - '_records/qualification/**/semantic-receipt.json'

permissions:
  contents: read

jobs:
  validate-semantic-receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out semantic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Validate frozen evidence membership and allocation
        run: |
          set -euo pipefail
          run_id="${GITHUB_REF_NAME##*/}"
          semantic="_records/qualification/$run_id/semantic-receipt.json"
          evidence="_records/discovery-preflight/result/article-evidence.json"
          test -f "$semantic"
          test -f "$evidence"
          node _tools/validate-qualification-semantic-receipt.mjs "$semantic" "$evidence"
