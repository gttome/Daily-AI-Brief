name: One-time reader compatibility patch

on:
  push:
    branches:
      - efficiency-revision-2026-09-17
    paths:
      - .github/workflows/reader-compat-once.yml

permissions:
  contents: write

jobs:
  patch-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efficiency-revision-2026-09-17
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve historical podcast and feed output
        shell: python
        run: |
          from pathlib import Path
          p = Path('_generator/lib/reader.mjs')
          text = p.read_text()
          marker = "const multiPodcastPolicyActive=(stories[0]?.brief_date||'')>=MULTI_PODCAST_EFFECTIVE_DATE;"
          if marker not in text:
              old = "export function renderJsonFeed(stories) {\n  return JSON.stringify({"
              new = "export function renderJsonFeed(stories) {\n  const multiPodcastPolicyActive=(stories[0]?.brief_date||'')>=MULTI_PODCAST_EFFECTIVE_DATE;\n  return JSON.stringify({"
              if old not in text:
                  raise SystemExit('renderJsonFeed anchor not found')
              text = text.replace(old, new, 1)
              old_desc = "    description: 'Six AI articles, up to two videos, and up to two podcasts selected daily.',"
              new_desc = "    description: multiPodcastPolicyActive ? 'Six AI articles, up to two videos, and up to two podcasts selected daily.' : 'Six AI articles, two videos, and one podcast selected daily for George Tome.',"
              if old_desc not in text:
                  raise SystemExit('feed description anchor not found')
              text = text.replace(old_desc, new_desc, 1)
              old_page = "      files.set(`podcasts/${story.brief_date}/${story.slug}.md`, header + `[← Home]({{ '/' | relative_url }}) · [Daily Brief]({{ '/briefs/${story.brief_date}/' | relative_url }})\\n\\n# ${story.headline}\\n\\n` + renderPodcastItem(story.podcast, story.brief_date, story.ordinal) + `\\n\\n[← Back to Home]({{ '/' | relative_url }})\\n`);"
              new_page = "      const podcastBody=story.brief_date<MULTI_PODCAST_EFFECTIVE_DATE\\n        ? renderPodcast(story.podcast, story.brief_date).replace(/^## Worth Listening — Podcast\\n\\n### 9\\. [^\\n]+\\n\\n/, '')\\n        : renderPodcastItem(story.podcast, story.brief_date, story.ordinal);\\n      files.set(`podcasts/${story.brief_date}/${story.slug}.md`, header + `[← Home]({{ '/' | relative_url }}) · [Daily Brief]({{ '/briefs/${story.brief_date}/' | relative_url }})\\n\\n# ${story.headline}\\n\\n` + podcastBody + `\\n\\n[← Back to Home]({{ '/' | relative_url }})\\n`);"
              if old_page not in text:
                  raise SystemExit('podcast page anchor not found')
              text = text.replace(old_page, new_page, 1)
              p.write_text(text)
      - name: Run regression gates
        run: |
          node --test _generator/test/*.test.mjs
          node _tools/validate-contracts.mjs
          node _generator/cli.mjs validate-repo --commit "$(git rev-parse HEAD)"
          node _generator/cli.mjs integration-check
      - name: Commit compatibility fix
        run: |
          if git diff --quiet -- _generator/lib/reader.mjs; then
            echo "Compatibility patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _generator/lib/reader.mjs
          git commit -m "Preserve historical podcast reader output"
          git push origin HEAD:efficiency-revision-2026-09-17
