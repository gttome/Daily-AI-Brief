name: Reliable execution development
on:
  push:
    branches: ['hardening/reliable-edition-execution-2026-09-29']
    paths: ['.github/workflows/reliable-execution-development.yml']
permissions:
  contents: write
concurrency:
  group: reliable-execution-development
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Apply exact source integration with original transport safeguards
        run: |
          set -euo pipefail
          mkdir -p /tmp/reliable-execution-proof
          git diff --quiet 49e43aa9a581866c487140b27400cc39e8531037 -- _data _records briefs assets _generator/lib/image-gate.mjs _generator/lib/native-image-delivery.mjs _generator/lib/publication-manifest.mjs
          node _tools/apply-reliable-execution-change.mjs | tee /tmp/reliable-execution-proof/migration.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const line='Normal transport remains `connector-first-v1`. Complete payload delivery failures remain `CAPABILITY_BLOCKED_CONNECTOR_BINARY_PAYLOAD_DELIVERY`; all V2 raw/final provenance requirements remain unchanged. A current denial stops that operation; no alternate endpoint may evade it.\n\n';
          for(const p of ['docs/operations/START-HERE.md','docs/operations/LIVING-SYSTEM-OPERATIONS.md']){
            const text=fs.readFileSync(p,'utf8'),target='A real supported native host and binary-reader adapter are still required;';
            if(text.split(target).length!==2)throw Error('nonunique_transport_guidance_edit');
            fs.writeFileSync(p,text.replace(target,line+target));
          }
          NODE
      - name: Targeted interruption and transport regressions
        run: |
          set -euo pipefail
          node --test _generator/test/reliable-execution.test.mjs _generator/test/image-execution.test.mjs _generator/test/native-image-delivery.test.mjs _generator/test/run-state-recovery.test.mjs _generator/test/publication-manifest.test.mjs _generator/test/image-transport-parity.test.mjs | tee /tmp/reliable-execution-proof/targeted.tap
      - name: Full regression and contract checks
        run: |
          set -euo pipefail
          node --test _generator/test/*.test.mjs | tee /tmp/reliable-execution-proof/full.tap
          node _tools/validate-contracts.mjs | tee /tmp/reliable-execution-proof/contracts.json
      - name: Verify build-once packaging with existing historical content
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {sealPublicationBundle,verifyPublicationBundle} from './_generator/lib/edition-execution.mjs';
          import {hashBytes,stableJson} from './_generator/lib/durable-operation.mjs';
          const p='_records/editorial-handoff/publication-manifest.json',m=JSON.parse(fs.readFileSync(p));
          const cutoff=JSON.parse(fs.readFileSync(m.artifacts.metadata_candidates.path)).cutoff;
          const args={releaseSha:'49e43aa9a581866c487140b27400cc39e8531037',cutoff};
          const a=sealPublicationBundle('.',p,args),b=sealPublicationBundle('.',p,args);
          assert.equal(a.bundle_sha256,b.bundle_sha256);
          assert.equal(verifyPublicationBundle('.',a).result,'pass');
          const shortened={...a,artifacts:a.artifacts.slice(1)};
          delete shortened.bundle_sha256;shortened.bundle_sha256=hashBytes(stableJson(shortened));
          assert.throws(()=>verifyPublicationBundle('.',shortened),/incomplete/);
          fs.writeFileSync('/tmp/reliable-execution-proof/bundle-smoke.json',JSON.stringify({result:'pass',scope:'historical-content packaging only, not native-image or public-run proof',bundle_sha256:a.bundle_sha256,artifacts:a.artifacts.length,original_cutoff:cutoff,native_generation_calls:0,production_mutation:false},null,2));
          NODE
      - name: Prepare verified tree and capture commit diagnostics
        run: |
          exec > >(tee /tmp/reliable-execution-proof/persist.log) 2>&1
          set -euxo pipefail
          test "$GITHUB_REF_NAME" = 'hardening/reliable-edition-execution-2026-09-29'
          git status --short
          git diff --quiet 49e43aa9a581866c487140b27400cc39e8531037 -- _data _records briefs assets _generator/lib/image-gate.mjs _generator/lib/native-image-delivery.mjs _generator/lib/publication-manifest.mjs
          rm _tools/apply-reliable-execution-change.mjs .github/workflows/reliable-execution-development.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --stat
          git diff --binary 49e43aa9a581866c487140b27400cc39e8531037 > /tmp/reliable-execution-proof/implementation.patch
          git diff --name-only 49e43aa9a581866c487140b27400cc39e8531037 > /tmp/reliable-execution-proof/changed-files.txt
          python3 - <<'PY'
          import zipfile,hashlib,json
          from pathlib import Path
          names=Path('/tmp/reliable-execution-proof/changed-files.txt').read_text().splitlines()
          hashes={}
          with zipfile.ZipFile('/tmp/reliable-execution-proof/implementation.zip','w',zipfile.ZIP_DEFLATED) as z:
            for n in names:
              p=Path(n)
              if p.is_file():
                z.write(p,n);hashes[n]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('/tmp/reliable-execution-proof/final-source-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
          git commit -m 'Integrate tested recoverable edition execution; preserve native-host proof boundary'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > /tmp/reliable-execution-proof/verified-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reliable-execution-proof-${{ github.run_id }}
          path: /tmp/reliable-execution-proof/
          retention-days: 14
          if-no-files-found: error
