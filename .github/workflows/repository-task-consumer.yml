name: Daily AI Brief Repository Task Consumer

on:
  push:
    branches:
      - main
      - 'reliable-edition/**'
    paths:
      - '.github/workflows/repository-task-consumer.yml'
      - '_generator/lib/repository-task-consumer.mjs'
      - '_tools/repository-task-consumer.mjs'
      - '_records/edition-execution/worker-requests/**/17-*.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-ai-brief-repository-task-consumer
  cancel-in-progress: false

jobs:
  consume-task17:
    runs-on: ubuntu-latest
    env:
      CONSUMER_OWNER: github-actions-repository-task-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out protected control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: control
          fetch-depth: 0

      - name: Resolve active run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          pointer="control/data/operations/active-production-run.json"
          active="$(node -e "const x=require('./$pointer');process.stdout.write(String(x.active===true && x.terminal!==true))")"
          if [ "$active" != "true" ]; then echo "should_run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          {
            echo "RUN_BRANCH=$(node -e "const x=require('./$pointer');process.stdout.write(x.branch)")"
            echo "EXECUTION_KEY=$(node -e "const x=require('./$pointer');process.stdout.write(x.execution_key)")"
            echo "EXECUTION_ID=$(node -e "const x=require('./$pointer');process.stdout.write(x.execution_id)")"
            echo "EDITION_ID=$(node -e "const x=require('./$pointer');process.stdout.write(x.edition_id)")"
          } >> "$GITHUB_ENV"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Check out active production branch
        if: steps.resolve.outputs.should_run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RUN_BRANCH }}
          path: run
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.resolve.outputs.should_run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Find queued Task 17 repository request
        if: steps.resolve.outputs.should_run == 'true'
        id: request
        shell: bash
        run: |
          set -euo pipefail
          dir="run/_records/edition-execution/worker-requests/$EXECUTION_ID"
          request=""
          if [ -d "$dir" ]; then
            for file in "$dir"/17-*.json; do
              [ -f "$file" ] || continue
              queued="$(node -e "const x=require('./$file');process.stdout.write(String(x.status==='queued'&&x.capability==='repository'))")"
              if [ "$queued" = "true" ]; then request="$file"; break; fi
            done
          fi
          if [ -z "$request" ]; then echo "has_request=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "has_request=true" >> "$GITHUB_OUTPUT"
          echo "request=$request" >> "$GITHUB_OUTPUT"

      - name: Acquire task consumer writer fence
        if: steps.request.outputs.has_request == 'true'
        id: fence
        shell: bash
        run: |
          set -euo pipefail
          git -C run config user.name "github-actions[bot]"
          git -C run config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git -C run fetch --no-tags origin "$RUN_BRANCH"
          git -C run reset --hard "origin/$RUN_BRANCH"
          lease_rel="_records/edition-execution/writer-leases/$EXECUTION_ID.json"
          node control/_tools/run-supervisor.mjs writer-lease \
            --execution-id "$EXECUTION_ID" --owner-id "$CONSUMER_OWNER" \
            --ttl-ms 900000 --takeover-dead-owner true \
            --current "run/$lease_rel" --output /tmp/lease.json >/tmp/fence.json
          cp /tmp/lease.json "run/$lease_rel"
          generation="$(node -e "const x=require('/tmp/lease.json');process.stdout.write(String(x.generation))")"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          git -C run add "$lease_rel"
          git -C run commit -m "Repository consumer acquire writer fence for $EXECUTION_ID"
          git -C run push origin "HEAD:$RUN_BRANCH"

      - name: Consume Task 17 from authoritative image evidence
        if: steps.request.outputs.has_request == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C run fetch --no-tags origin "$RUN_BRANCH"
          git -C run reset --hard "origin/$RUN_BRANCH"
          request="${{ steps.request.outputs.request }}"
          request="run/${request#run/}"
          node control/_tools/repository-task-consumer.mjs --run-root run --request "$request" >/tmp/result.json
          cat /tmp/result.json

          lease_rel="_records/edition-execution/writer-leases/$EXECUTION_ID.json"
          node -e "const fs=require('fs');const p='run/'+process.argv[1];const x=JSON.parse(fs.readFileSync(p,'utf8'));const at=new Date().toISOString();x.last_heartbeat_at=at;x.expires_at=at;x.released_at=at;x.release_reason='TASK17_DONE_HANDOFF_TO_SUPERVISOR';fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n')" "$lease_rel"

          git -C run add "_records/edition-execution/worker-requests/$EXECUTION_ID" \
            "_records/edition-execution/worker-results/$EXECUTION_ID" \
            "_records/edition-execution/events/$EXECUTION_KEY" \
            "_records/editorial-handoff/images-${EXECUTION_KEY%-run*}.json" \
            "_records/image-quality/${EXECUTION_KEY%-run*}-editorial-v2.json" \
            "$lease_rel"
          git -C run commit -m "Complete $EXECUTION_ID Task 17 image-set review"
          git -C run push origin "HEAD:$RUN_BRANCH"
