name: Daily AI Brief Run Supervisor

on:
  push:
    branches:
      - main
      - 'rehearsal/**'
    paths:
      - data/operations/active-production-run.json
      - _records/rehearsal/active-public-rehearsal.json
      - _generator/lib/run-supervisor.mjs
      - _tools/run-supervisor.mjs
      - docs/operations/task-recovery-contracts.json
      - .github/workflows/run-supervisor.yml
  workflow_dispatch:
    inputs:
      run_branch:
        description: Existing production run branch to supervise
        required: true
        type: string
      execution_key:
        description: Run event key such as 2026-10-01-run4
        required: true
        type: string
      execution_id:
        description: Immutable execution identity
        required: true
        type: string
      edition_id:
        description: Immutable edition identity
        required: true
        type: string
      takeover_dead_owner:
        description: Permit a new fence only when watchdog confirmed the prior Supervisor is dead
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: daily-ai-brief-run-supervisor
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPERVISOR_OWNER: github-actions-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out protected control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: control
          fetch-depth: 0

      - name: Check out rehearsal trigger branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'rehearsal/')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          path: trigger
          fetch-depth: 1

      - name: Resolve exact existing run identity
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_branch="${{ inputs.run_branch }}"
            execution_key="${{ inputs.execution_key }}"
            execution_id="${{ inputs.execution_id }}"
            edition_id="${{ inputs.edition_id }}"
            takeover="${{ inputs.takeover_dead_owner }}"
            should_run=true
          elif [[ "${GITHUB_REF_NAME}" == rehearsal/* ]]; then
            pointer="trigger/_records/rehearsal/active-public-rehearsal.json"
            [ -f "$pointer" ] || { echo "should_run=false" >> "$GITHUB_OUTPUT"; exit 0; }
            rehearsal_ok="$(node -e "const x=require('./$pointer');process.stdout.write(String(
              x.mode==='FULL_PUBLIC_REHEARSAL' &&
              x.active===true &&
              x.terminal!==true &&
              x.rehearsal_handoff===true &&
              x.production_allocation===false &&
              x.canonical_pointers_mutable===false &&
              x.image_generation_allowed===true &&
              x.publication_mode==='isolated_preview' &&
              x.branch===process.env.GITHUB_REF_NAME
            ))")"
            [ "$rehearsal_ok" = "true" ] || exit 1
            run_branch="$(node -e "const x=require('./$pointer');process.stdout.write(x.branch)")"
            execution_key="$(node -e "const x=require('./$pointer');process.stdout.write(x.execution_key)")"
            execution_id="$(node -e "const x=require('./$pointer');process.stdout.write(x.execution_id)")"
            edition_id="$(node -e "const x=require('./$pointer');process.stdout.write(x.edition_id)")"
            takeover=true
            should_run=true
          else
            pointer="control/data/operations/active-production-run.json"
            active="$(node -e "const x=require('./$pointer');process.stdout.write(String(x.active===true && x.terminal!==true))")"
            if [ "$active" != "true" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_branch="$(node -e "const x=require('./$pointer');process.stdout.write(x.branch)")"
            execution_key="$(node -e "const x=require('./$pointer');process.stdout.write(x.execution_key)")"
            execution_id="$(node -e "const x=require('./$pointer');process.stdout.write(x.execution_id)")"
            edition_id="$(node -e "const x=require('./$pointer');process.stdout.write(x.edition_id)")"
            takeover=true
            should_run=true
          fi
          {
            echo "RUN_BRANCH=$run_branch"
            echo "EXECUTION_KEY=$execution_key"
            echo "EXECUTION_ID=$execution_id"
            echo "EDITION_ID=$edition_id"
            echo "TAKEOVER_DEAD_OWNER=$takeover"
          } >> "$GITHUB_ENV"
          {
            echo "should_run=$should_run"
            echo "execution_id=$execution_id"
          } >> "$GITHUB_OUTPUT"

      - name: Check out repository working copy
        if: steps.resolve.outputs.should_run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: run
          fetch-depth: 0

      - name: Switch working copy to existing production branch
        if: steps.resolve.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git -C run fetch --no-tags origin "$RUN_BRANCH"
          git -C run checkout --detach "origin/$RUN_BRANCH"

      - name: Set up Node.js
        if: steps.resolve.outputs.should_run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Validate Supervisor contracts and cumulative learning
        if: steps.resolve.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          node control/_tools/run-supervisor.mjs validate-contracts \
            --file control/docs/operations/task-recovery-contracts.json
          node control/_tools/operational-learning.mjs validate \
            --ledger control/data/operations/production-continuous-improvement-ledger.jsonl \
            --repo-root control

      - name: Check publication boundary before acquiring any writer
        if: steps.resolve.outputs.should_run == 'true'
        id: boundary
        run: |
          set -euo pipefail
          node control/_tools/run-supervisor.mjs tick --run-root run \
            --execution-key "$EXECUTION_KEY" --execution-id "$EXECUTION_ID" \
            --edition-id "$EDITION_ID" --branch "$RUN_BRANCH" \
            --contracts control/docs/operations/task-recovery-contracts.json \
            --writer-generation 1 > /tmp/boundary.json
          node -e "const fs=require('fs'),x=require('/tmp/boundary.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'write_allowed='+x.publication.write_allowed+'\n'+'handoff='+(x.publication.action==='protected_publication_handoff')+'\n')"

      - name: Hand frozen candidate to protected publication
        if: steps.boundary.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUN_BRANCH" == rehearsal/* ]]; then
            echo "Isolated rehearsal candidate frozen. Canonical publication dispatch is prohibited."
          else
            node control/_tools/dispatch-frozen-publication.mjs
          fi

      - name: Yield while a scheduled image consumer owns the next operation
        if: steps.boundary.outputs.write_allowed == 'true'
        id: image_delegation
        run: |
          set -euo pipefail
          delegated=false
          delegated_task=""
          request_dir="run/_records/edition-execution/worker-requests/${EXECUTION_ID}"
          if [ -d "$request_dir" ]; then
            delegated_task="$(node -e 'const fs=require("fs"),p=require("path");const d=process.argv[1],events=process.argv[2];const latest=new Map();for(const n of fs.readdirSync(d).sort()){if(!n.endsWith(".json"))continue;const x=JSON.parse(fs.readFileSync(p.join(d,n),"utf8"));const t=String(x.task_id||"").padStart(2,"0");if(!/^1[1-6]$/.test(t))continue;const prior=latest.get(t);const ts=Date.parse(x.created_at||0)||0;const pts=prior?(Date.parse(prior.x.created_at||0)||0):-1;if(!prior||ts>pts||(ts===pts&&n>prior.n))latest.set(t,{n,x})}const eventNames=fs.existsSync(events)?fs.readdirSync(events):[];let found="";for(const t of [...latest.keys()].sort()){if(eventNames.some(n=>n.startsWith(t+"-done")&&n.endsWith(".json")))continue;const x=latest.get(t).x;if(x.capability==="native_chatgpt"&&String(x.status||"")==="queued_for_scheduled_consumer"){found=t;break}}process.stdout.write(found)' "$request_dir" "run/_records/edition-execution/events/${EXECUTION_KEY}")"
          fi
          if [ -n "$delegated_task" ]; then
            delegated=true
            echo "Task ${delegated_task} is already queued for the scheduled image consumer; Supervisor will not acquire or take over the writer fence."
          fi
          echo "delegated=$delegated" >> "$GITHUB_OUTPUT"

      - name: Configure run-branch writer
        if: steps.boundary.outputs.write_allowed == 'true' && steps.image_delegation.outputs.delegated != 'true'
        run: |
          git -C run config user.name "github-actions[bot]"
          git -C run config user.email "4189826+github-actions[bot]@users.noreply.github.com"

      - name: Acquire fenced writer authority for this exact execution
        if: steps.boundary.outputs.write_allowed == 'true' && steps.image_delegation.outputs.delegated != 'true'
        id: fence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lease_rel="_records/edition-execution/writer-leases/${EXECUTION_ID}.json"
          mkdir -p "run/$(dirname "$lease_rel")"
          current_args=()
          dead_proof_args=()
          if [ -f "run/$lease_rel" ]; then
            current_args=(--current "run/$lease_rel")
            current_owner="$(node -e "const x=require('./run/' + process.argv[1]);process.stdout.write(String(x.owner_id||''))" "$lease_rel")"
            if [ "$current_owner" != "$SUPERVISOR_OWNER" ] && [ "$TAKEOVER_DEAD_OWNER" = "true" ]; then
              dead_run_id="$(node -e "const x=require('./run/' + process.argv[1]);const m=/^github-actions-(\\d+)-(\\d+)$/.exec(String(x.owner_id||''));process.stdout.write(m?m[1]:'')" "$lease_rel")"
              if [ -n "$dead_run_id" ]; then
                if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${dead_run_id}" > /tmp/prior-writer-run.json 2>/dev/null; then
                  prior_state="$(node -e "const x=require('/tmp/prior-writer-run.json');process.stdout.write(String(x.status||'')+':'+String(x.conclusion||''))")"
                  if [ "$prior_state" = "completed:failure" ] || [ "$prior_state" = "completed:cancelled" ]; then
                    node control/_tools/protected-repair-executor.mjs dead-writer-proof \
                      --lease "run/$lease_rel" \
                      --workflow-run /tmp/prior-writer-run.json \
                      --output /tmp/dead-writer-proof.json >/tmp/dead-writer-proof.stdout
                    cat /tmp/dead-writer-proof.stdout
                    dead_proof_args=(--dead-owner-proof /tmp/dead-writer-proof.json)
                  fi
                fi
              fi
            fi
          fi

          set +e
          node control/_tools/run-supervisor.mjs writer-lease \
            --execution-id "$EXECUTION_ID" \
            --owner-id "$SUPERVISOR_OWNER" \
            --ttl-ms 300000 \
            --takeover-dead-owner "$TAKEOVER_DEAD_OWNER" \
            "${current_args[@]}" "${dead_proof_args[@]}" \
            --output /tmp/writer-lease.json > /tmp/writer-result.json
          rc=$?
          set -e
          cat /tmp/writer-result.json
          if [ "$rc" -ne 0 ]; then
            echo "A live or unproven writer still owns the exact execution; Supervisor yields without stealing authority."
            echo "acquired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp /tmp/writer-lease.json "run/$lease_rel"
          generation="$(node -e "const x=require('/tmp/writer-lease.json');process.stdout.write(String(x.generation))")"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "acquired=true" >> "$GITHUB_OUTPUT"

          if [ -f /tmp/dead-writer-proof.json ]; then
            proof_rel="$(node -e 'const fs=require("fs"),x=require("/tmp/dead-writer-proof.json"),lease=require("/tmp/writer-lease.json");x.replacement_generation=lease.generation;const rel="_records/edition-execution/dead-writer-recovery/"+x.execution_id+"/"+x.dead_generation+"-to-"+x.replacement_generation+"-"+x.workflow_run_id+".json";fs.writeFileSync("/tmp/dead-writer-proof-final.json",JSON.stringify(x,null,2)+"\\n");process.stdout.write(rel)')"
            mkdir -p "run/$(dirname "$proof_rel")"
            cp /tmp/dead-writer-proof-final.json "run/$proof_rel"
            git -C run add "$proof_rel"
          fi

          git -C run add "$lease_rel"
          if ! git -C run diff --cached --quiet; then
            git -C run commit -m "Supervisor acquire writer fence for ${EXECUTION_ID}"
            git -C run pull --rebase origin "$RUN_BRANCH"
            git -C run push origin "HEAD:$RUN_BRANCH"
          fi

      - name: Persistent approximately one-minute supervision loop
        if: steps.boundary.outputs.write_allowed == 'true' && steps.image_delegation.outputs.delegated != 'true' && steps.fence.outputs.acquired == 'true'
        env:
          WRITER_GENERATION: ${{ steps.fence.outputs.generation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lease_rel="_records/edition-execution/writer-leases/${EXECUTION_ID}.json"
          deadline=$((SECONDS + 18900))
          loop=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            loop=$((loop + 1))
            # Hot-reload protected control-plane code/contracts every loop.
            git -C control fetch --no-tags origin main
            git -C control reset --hard origin/main
            git -C run fetch --no-tags origin "$RUN_BRANCH"
            git -C run reset --hard "origin/$RUN_BRANCH"

            # A legitimate one-writer transfer may happen between loops.
            # Check ownership before renewal so a transferred lease is a clean
            # yield, never a red production failure.
            if ! node control/_tools/run-supervisor.mjs assert-fence \
              --lease "run/$lease_rel" \
              --execution-id "$EXECUTION_ID" \
              --owner-id "$SUPERVISOR_OWNER" \
              --generation "$WRITER_GENERATION" >/tmp/fence-check.json 2>/tmp/fence-check.err; then
              echo "Writer fence transferred to another owner/generation; Supervisor yields without treating the handoff as a production failure."
              cat /tmp/fence-check.err || true
              break
            fi

            # Renew locally after ownership is confirmed. A transfer can still
            # race this check, so renewal failure is also a clean yield.
            if ! node control/_tools/run-supervisor.mjs writer-lease \
              --execution-id "$EXECUTION_ID" \
              --owner-id "$SUPERVISOR_OWNER" \
              --ttl-ms 300000 \
              --current "run/$lease_rel" \
              --output /tmp/writer-lease.json > /tmp/writer-renewal.json 2>/tmp/writer-renewal.err; then
              echo "Writer fence changed during renewal; Supervisor yields without treating the handoff as a production failure."
              cat /tmp/writer-renewal.err || true
              break
            fi
            cp /tmp/writer-lease.json "run/$lease_rel"

            # Consume only complete, hash-bound PNG chunk requests left by a
            # prior fenced scheduled image worker. Malformed requests fail
            # closed without stopping the persistent Supervisor.
            node control/_tools/image-chunk-bridge.mjs consume \
              --run-root run \
              --execution-id "$EXECUTION_ID" \
              --branch "$RUN_BRANCH" \
              --writer-generation "$WRITER_GENERATION" >/tmp/image-chunk-bridge.json
            cat /tmp/image-chunk-bridge.json

            last_progress="$(
              git -C run log -1 --format=%cI -- \
                "_records/edition-execution/events/${EXECUTION_KEY}" \
                "_records/image-attempts/${EXECUTION_KEY}" \
                "_records/editorial-handoff" \
                "_records/publication" \
                "_data/editions" 2>/dev/null || true
            )"

            tick_args=()
            if [ -n "$last_progress" ]; then tick_args+=(--last-progress-at "$last_progress"); fi
            node control/_tools/run-supervisor.mjs tick \
              --run-root run \
              --execution-key "$EXECUTION_KEY" \
              --execution-id "$EXECUTION_ID" \
              --edition-id "$EDITION_ID" \
              --branch "$RUN_BRANCH" \
              --contracts control/docs/operations/task-recovery-contracts.json \
              --writer-generation "$WRITER_GENERATION" \
              "${tick_args[@]}" > /tmp/supervisor-tick.json
            cat /tmp/supervisor-tick.json
            boundary="$(node -e "const x=require('/tmp/supervisor-tick.json');process.stdout.write(x.publication.action)")"
            if [ "$boundary" = "protected_publication_handoff" ]; then
              if [[ "$RUN_BRANCH" == rehearsal/* ]]; then
                echo "Isolated rehearsal candidate frozen. Leave publication to the rehearsal preview controller."
              else
                node control/_tools/dispatch-frozen-publication.mjs
              fi
              break
            fi
            if [ "$boundary" = "none" ]; then break; fi

            kanban_fresh="$(node -e "const x=require('/tmp/supervisor-tick.json');process.stdout.write(String(x.kanban.fresh))")"
            if [ "$kanban_fresh" != "true" ]; then
              kanban_path="run/_records/edition-execution/kanban/${EXECUTION_KEY}.json"
              node control/_tools/run-supervisor.mjs project-kanban \
                --run-root run \
                --execution-key "$EXECUTION_KEY" \
                --execution-id "$EXECUTION_ID" \
                --edition-id "$EDITION_ID" \
                --contracts control/docs/operations/task-recovery-contracts.json \
                --output "$kanban_path" >/tmp/kanban-projection.json
            fi

            protected_repair_boundary=false
            has_request="$(node -e "const x=require('/tmp/supervisor-tick.json');process.stdout.write(x.worker_request?'true':'false')")"
            if [ "$has_request" = "true" ]; then
              node -e "const fs=require('fs');const x=require('/tmp/supervisor-tick.json');fs.writeFileSync('/tmp/worker-request.json',JSON.stringify(x.worker_request,null,2)+'\n')"
              node control/_tools/run-supervisor.mjs enqueue \
                --run-root run \
                --request /tmp/worker-request.json >/tmp/enqueue-result.json
              cat /tmp/enqueue-result.json

              request_kind="$(node -e "const x=require('/tmp/worker-request.json');process.stdout.write(String(x.request_kind||''))")"
              request_capability="$(node -e "const x=require('/tmp/worker-request.json');process.stdout.write(String(x.capability||''))")"
              request_task="$(node -e "const x=require('/tmp/worker-request.json');process.stdout.write(String(x.task_id||''))")"
              if [ "$request_capability" = "repository" ] && [ "$request_kind" != "engineering_repair" ]; then
                request_key="$(node -e "const x=require('/tmp/worker-request.json');process.stdout.write(String(x.request_key))")"
                request_rel="_records/edition-execution/worker-requests/${EXECUTION_ID}/${request_task}-${request_key}.json"
                liveness_rel="_records/edition-execution/liveness-faults/${EXECUTION_ID}/${request_task}-${request_key}-unclaimed.json"
                node control/_tools/run-supervisor.mjs repository-liveness \
                  --request "run/$request_rel" \
                  --max-idle-seconds 60 \
                  --output /tmp/repository-liveness.json >/tmp/repository-liveness.stdout
                cat /tmp/repository-liveness.stdout
                repository_liveness_state="$(node -e "const x=require('/tmp/repository-liveness.json');process.stdout.write(String(x.state))")"
                if [ "$repository_liveness_state" = "fault" ] && [ ! -f "run/$liveness_rel" ]; then
                  mkdir -p "run/$(dirname "$liveness_rel")"
                  cp /tmp/repository-liveness.json "run/$liveness_rel"
                  git -C run add "$liveness_rel"
                  git -C run commit -m "Record unclaimed Task ${request_task} repository-worker liveness fault"
                  git -C run pull --rebase origin "$RUN_BRANCH"
                  git -C run push origin "HEAD:$RUN_BRANCH"
                  echo "::error title=Repository worker liveness fault::Task ${request_task} request ${request_key} exceeded the protected 60-second unclaimed threshold. Hourly recovery remains enabled; this route-specific fault is not a global stop."
                fi
              fi
              if [ "$request_capability" = "native_chatgpt" ] && [[ "$request_task" =~ ^1[1-6]$ ]]; then
                request_key="$(node -e "const x=require('/tmp/worker-request.json');process.stdout.write(String(x.request_key))")"
                request_rel="_records/edition-execution/worker-requests/${EXECUTION_ID}/${request_task}-${request_key}.json"
                python control/_tools/native-image-worker.py \
                  --run-root run \
                  --request "run/$request_rel" \
                  --execution-key "$EXECUTION_KEY" \
                  --execution-id "$EXECUTION_ID" \
                  --edition-id "$EDITION_ID" \
                  --writer-generation "$WRITER_GENERATION" >/tmp/native-image-result.json
                cat /tmp/native-image-result.json
              fi

              if [ "$request_capability" = "repository" ] && [ "$request_task" = "17" ] && [ "$request_kind" != "engineering_repair" ]; then
                request_key="$(node -e "const x=require('/tmp/worker-request.json');process.stdout.write(String(x.request_key))")"
                request_rel="_records/edition-execution/worker-requests/${EXECUTION_ID}/${request_task}-${request_key}.json"
                request_status="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('run/'+process.argv[1],'utf8'));process.stdout.write(String(x.status||''))" "$request_rel")"
                if [ "$request_status" = "queued" ]; then
                  active_repository_consumers="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/repository-task-consumer.yml/runs" \
                    -f branch="$RUN_BRANCH" -f per_page=20 \
                    --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')"
                  if [ "$active_repository_consumers" = "0" ]; then
                    echo "Dispatching Task 17 repository consumer explicitly via workflow_dispatch; pushes created by GITHUB_TOKEN do not recursively trigger workflows."
                    gh workflow run repository-task-consumer.yml --ref "$RUN_BRANCH"
                  else
                    echo "Task 17 repository consumer already queued/in progress; no duplicate dispatch."
                  fi
                fi
              fi
              if [ "$request_kind" = "engineering_repair" ] && [ "$request_capability" = "repository" ]; then
                export GH_TOKEN="${{ github.token }}"
                repair_dir="run/_records/edition-execution/protected-repairs/${EXECUTION_ID}"
                repair_record=""
                if [ -d "$repair_dir" ]; then
                  repair_record="$(node - "$repair_dir" "$request_task" <<'NODE'
                  const fs=require('fs'),p=require('path'),d=process.argv[2],task=String(process.argv[3]).padStart(2,'0');
                  const rows=[];
                  for(const name of fs.readdirSync(d).filter(x=>x.endsWith('.json')).sort()){
                    const file=p.join(d,name),x=JSON.parse(fs.readFileSync(file,'utf8'));
                    if(String(x.task_id||'').padStart(2,'0')!==task)continue;
                    if(!['PROTECTED_REPAIR_REQUIRED','REPAIR_CI_FAIL','REPAIR_MERGE_CONFLICT','REPAIR_RESUME_FAILED'].includes(String(x.state||'')))continue;
                    rows.push({file,t:Date.parse(x.created_at||0)||0});
                  }
                  rows.sort((a,b)=>b.t-a.t||b.file.localeCompare(a.file));
                  process.stdout.write(rows[0]?.file||'');
                  NODE
                  )"
                fi

                if [ -z "$repair_record" ]; then
                  echo "Engineering repair remains actionable but no bounded protected-repair record exists yet. This is not an owner boundary; release production authority so the Watchdog can prepare the smallest repair and persist PROTECTED_REPAIR_REQUIRED."
                  protected_repair_boundary=true
                else
                  cp "$repair_record" /tmp/protected-repair.json
                  if ! node control/_tools/protected-repair-executor.mjs validate-record \
                    --record /tmp/protected-repair.json \
                    --active control/data/operations/active-production-run.json >/tmp/protected-repair-validation.json; then
                    cat /tmp/protected-repair-validation.json
                    echo "Protected repair identity no longer matches the active execution. Fail closed and let recovery re-read authoritative state."
                    protected_repair_boundary=true
                  else
                    repair_key="$(node -e "const x=require('/tmp/protected-repair.json');process.stdout.write(x.repair_key)")"
                    repair_branch="$(node -e "const x=require('/tmp/protected-repair.json');process.stdout.write(x.repair_branch)")"
                    repair_head="$(node -e "const x=require('/tmp/protected-repair.json');process.stdout.write(x.repair_branch_head_sha)")"
                    gh pr list --repo "$GITHUB_REPOSITORY" --state all --base main --head "$repair_branch" --limit 20 \
                      --json number,state,headRefOid,body > /tmp/protected-repair-prs.json
                    repair_pr="$(node - "$repair_key" "$repair_head" <<'NODE'
                    const fs=require('fs'),[key,head]=process.argv.slice(2),xs=JSON.parse(fs.readFileSync('/tmp/protected-repair-prs.json','utf8'));
                    const m=xs.filter(x=>String(x.body||'').includes('Repair-Key: '+key)&&x.headRefOid===head);
                    if(m.length>1){console.error('duplicate_protected_repair_pr');process.exit(2)}
                    process.stdout.write(String(m[0]?.number||0));
                    NODE
                    )"
                    repair_state="NONE"
                    if [ "$repair_pr" -gt 0 ]; then
                      repair_state="$(gh pr view "$repair_pr" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
                    fi
                    if [ "$repair_state" != "MERGED" ]; then
                      echo "Protected repair $repair_key has not crossed PR/CI/merge yet. Release production writer; the Protected Repair Executor continues from the exact durable stage."
                      protected_repair_boundary=true
                    else
                      repair_ci_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${repair_head}&per_page=100" \
                        --jq '[.workflow_runs[] | select(.name=="Deterministic publication CI" and .conclusion=="success")] | sort_by(.updated_at) | reverse | .[0].id // 0')"
                      if [ "$repair_ci_run" -le 0 ]; then
                        echo "Merged repair has no exact-head protected CI PASS evidence; fail closed and continue recovery instead of accepting unrelated green CI."
                        protected_repair_boundary=true
                      else
                        node control/_tools/repository-repair-consumer.mjs consume \
                          --run-root run \
                          --control-root control \
                          --execution-key "$EXECUTION_KEY" \
                          --request /tmp/worker-request.json \
                          --writer-generation "$WRITER_GENERATION" \
                          --protected-ci-run-id "$repair_ci_run" \
                          --protected-ci-sha "$repair_head" \
                          --protected-ci-conclusion success >/tmp/repository-repair-result.json
                        cat /tmp/repository-repair-result.json
                      fi
                    fi
                  fi
                fi
              fi
            fi

            progress_before="$(git -C run rev-parse HEAD)"
            git -C run add "_records/edition-execution/kanban/${EXECUTION_KEY}.json" 2>/dev/null || true
            git -C run add "_records/edition-execution/events/${EXECUTION_KEY}" 2>/dev/null || true
            git -C run add "_records/image-attempts/${EXECUTION_KEY}" 2>/dev/null || true
            git -C run add "briefs/images/${EXECUTION_KEY%-run*}" 2>/dev/null || true
            for dir in worker-requests worker-results repair-epochs; do
              if [ -d "run/_records/edition-execution/$dir" ]; then
                git -C run add "_records/edition-execution/$dir"
              fi
            done
            for dir in image-transport-requests image-transport-results; do
              if [ -d "run/_records/edition-execution/$dir" ]; then
                git -C run add -A "_records/edition-execution/$dir"
              fi
            done
            if ! git -C run diff --cached --quiet; then
              git -C run commit -m "Supervisor reconcile ${EXECUTION_ID} loop ${loop}"
              if ! git -C run push origin "HEAD:$RUN_BRANCH"; then
                git -C run fetch --no-tags origin "$RUN_BRANCH"
                git -C run rebase "origin/$RUN_BRANCH"
                git -C run push origin "HEAD:$RUN_BRANCH"
              fi
            fi

            if [ "$protected_repair_boundary" = "true" ]; then
              node control/_tools/run-supervisor.mjs release-writer-lease \
                --lease "run/$lease_rel" \
                --execution-id "$EXECUTION_ID" \
                --owner-id "$SUPERVISOR_OWNER" \
                --generation "$WRITER_GENERATION" \
                --reason PROTECTED_REPAIR_IN_PROGRESS \
                --output /tmp/released-writer-lease.json >/tmp/release-writer.stdout
              cat /tmp/release-writer.stdout
              cp /tmp/released-writer-lease.json "run/$lease_rel"
              git -C run add "$lease_rel"
              git -C run commit -m "Release production writer for protected repair"
              if ! git -C run push origin "HEAD:$RUN_BRANCH"; then
                git -C run fetch --no-tags origin "$RUN_BRANCH"
                git -C run rebase "origin/$RUN_BRANCH"
                git -C run push origin "HEAD:$RUN_BRANCH"
              fi
              gh workflow run protected-repair-executor.yml --repo "$GITHUB_REPOSITORY" --ref main || true
              echo "Protected repair is an intermediate recovery state. Supervisor released authority and yielded; recovery remains open."
              break
            fi

            terminal="$(node -e "const x=require('/tmp/supervisor-tick.json');process.stdout.write(String(x.terminal))")"
            if [ "$terminal" = "true" ]; then
              echo "All Tasks 00-29 are Done; Supervisor may stop."
              break
            fi

            # Drain a real state advance immediately. Idle reconciliation retains
            # the minute heartbeat; the elapsed deadline still bounds runner life.
            progress_after="$(git -C run rev-parse HEAD)"
            if ! git -C run diff --quiet "$progress_before" "$progress_after" -- "_records/edition-execution/events/$EXECUTION_KEY" "_records/image-attempts/$EXECUTION_KEY" _records/edition-execution/worker-results; then
              continue
            fi
            sleep 60
          done
