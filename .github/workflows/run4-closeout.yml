name: Close published Run 4 from exact evidence

on:
  push:
    branches: [main]
    paths:
      - _tools/run4-closeout.mjs
      - _tools/daily-validation.mjs
      - _generator/test/run4-closeout.test.mjs
      - .github/workflows/run4-closeout.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  pages: write
  issues: write

concurrency:
  group: close-published-run4
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Detect existing PUBLIC CLOSED evidence
        id: closed
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let closed=false;
          try {
            const x=JSON.parse(fs.readFileSync('_records/publication/2026-10-01/public-closed.json','utf8'));
            const c=JSON.parse(fs.readFileSync('_records/edition-execution/cleanup/dab-edition-2026-10-01-run4.json','utf8'));
            closed=x.state==='PUBLIC_CLOSED'&&c.result==='PASS'&&c.next_run_ready===true;
          } catch {}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'value='+(closed?'true':'false')+'\n');
          NODE

      - name: Prepare exact production completion evidence
        if: steps.closed.outputs.value != 'true'
        run: node _tools/run4-closeout.mjs prepare --out /tmp/run4-completion.json

      - name: Independently live-verify October 1 reader
        if: steps.closed.outputs.value != 'true'
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 12); do
            echo "Independent live verification attempt $attempt"
            set +e
            node _tools/daily-validation.mjs \
              --date 2026-10-01 \
              --completion /tmp/run4-completion.json \
              --out /tmp/run4-live-validation.json
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              success=1
              break
            fi
            sleep 15
          done
          test "$success" -eq 1

      - name: Build closure, lifecycle, Command Center and Task 29 evidence
        if: steps.closed.outputs.value != 'true'
        run: |
          set -euo pipefail
          node _tools/run4-closeout.mjs finalize \
            --completion /tmp/run4-completion.json \
            --validation /tmp/run4-live-validation.json
          node _tools/publication-lifecycle.mjs validate
          node _tools/operational-learning.mjs validate \
            --ledger data/operations/production-continuous-improvement-ledger.jsonl \
            --repo-root .
          node _tools/operational-learning.mjs task29 \
            --ledger data/operations/production-continuous-improvement-ledger.jsonl \
            --run-id reliable-edition-20261001-run4

      - name: Prohibit content or asset rework during closeout
        if: steps.closed.outputs.value != 'true'
        run: |
          set -euo pipefail
          bad="$(git diff --name-only | grep -E '^(_data/editions/|briefs/|stories/|videos/|podcasts/|briefs/images/)' || true)"
          if [ -n "$bad" ]; then
            echo "Closeout attempted to modify published content or assets:"
            echo "$bad"
            exit 1
          fi

      - name: Commit closure evidence to isolated finalization branch
        if: steps.closed.outputs.value != 'true'
        id: finalization
        run: |
          set -euo pipefail
          branch="finalization/2026-10-01-run4-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Persist Run 4 PUBLIC CLOSED and Task 29 evidence"
          git push origin "HEAD:$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge closure evidence through protected CI
        if: steps.closed.outputs.value != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          FINAL_BRANCH: ${{ steps.finalization.outputs.branch }}
          FINAL_SHA: ${{ steps.finalization.outputs.sha }}
        with:
          script: |
            const branch=process.env.FINAL_BRANCH,headSha=process.env.FINAL_SHA;
            let prs=(await github.rest.pulls.list({...context.repo,state:'open',base:'main',head:context.repo.owner+':'+branch,per_page:20})).data;
            let pr=prs[0];
            if(!pr){
              pr=(await github.rest.pulls.create({
                ...context.repo,head:branch,base:'main',
                title:'Finalize October 1 Run 4 PUBLIC CLOSED',
                body:'Closure-only evidence for the already-published Run 4. No Brief content, media, Watchlist selection, book mapping, or image asset is regenerated or changed.'
              })).data;
            }
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'ci.yml',ref:branch});
            let passing=null;
            for(let i=0;i<60;i++){
              await new Promise(resolve=>setTimeout(resolve,5000));
              const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'ci.yml',branch,event:'workflow_dispatch',per_page:30})).data.workflow_runs;
              const run=runs.find(x=>x.head_sha===headSha);
              if(run?.status==='completed'){
                if(run.conclusion!=='success')throw new Error('Protected finalization CI '+run.id+' ended '+run.conclusion);
                passing=run;break;
              }
            }
            if(!passing)throw new Error('No successful protected finalization CI observed in bounded window.');
            pr=(await github.rest.pulls.get({...context.repo,pull_number:pr.number})).data;
            if(pr.head.sha!==headSha)throw new Error('Finalization PR head changed after passing CI.');
            const merged=await github.rest.pulls.merge({...context.repo,pull_number:pr.number,sha:headSha,merge_method:'squash'});
            if(!merged.data.merged)throw new Error('Protected finalization merge denied: '+(merged.data.message||'not merged'));
            const mainSha=(await github.rest.git.getRef({...context.repo,ref:'heads/main'})).data.object.sha;
            if(mainSha!==merged.data.sha)throw new Error('Main moved before finalization deployment refresh.');
            await github.request('POST /repos/{owner}/{repo}/pages/builds',context.repo);
            const issues=(await github.rest.issues.listForRepo({...context.repo,state:'open',per_page:100})).data;
            for(const issue of issues){
              if(issue.title==='Daily AI Brief alert: deterministic validation failure'){
                await github.rest.issues.update({...context.repo,issue_number:issue.number,state:'closed'});
              }
            }
            await github.rest.git.deleteRef({...context.repo,ref:'heads/'+branch}).catch(()=>{});
            core.info('Run 4 closure evidence merged at '+merged.data.sha+' after protected CI '+passing.id+'.');

      - name: Report already closed
        if: steps.closed.outputs.value == 'true'
        run: echo "Run 4 already has durable PUBLIC CLOSED and Task 29 PASS evidence; no work replayed."
