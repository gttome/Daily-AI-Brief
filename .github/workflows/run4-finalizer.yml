name: Finalize active Run 4 candidate
on:
  push:
    branches: [main]
    paths:
      - _tools/run4-finalizer.mjs
      - .github/workflows/run4-finalizer.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: run4-finalizer
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'gttome/Daily-AI-Brief'
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: control
          fetch-depth: 0
      - name: Check out existing Run 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: reliable-edition/dab-edition-2026-10-01-run4
          path: run
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Merge protected main without rebasing
        run: |
          set -euo pipefail
          git -C run config user.name "github-actions[bot]"
          git -C run config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git -C run fetch --no-tags origin main
          if ! git -C run merge-base --is-ancestor origin/main HEAD; then
            git -C run merge --no-edit origin/main
          fi
      - name: Build and validate October 1 candidate
        run: node run/_tools/run4-finalizer.mjs run
      - name: Commit validated candidate to existing Run 4 branch
        run: |
          set -euo pipefail
          git -C run add -A
          if ! git -C run diff --cached --quiet; then
            git -C run commit -m "Assemble and validate Run 4 October 1 candidate"
          fi
          git -C run push origin HEAD:reliable-edition/dab-edition-2026-10-01-run4
