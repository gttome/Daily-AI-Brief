name: Finalize active Run 5 candidate

on:
  push:
    branches: [main]
    paths:
      - '_tools/run5-post-image-finalizer.mjs'
      - '_tools/run5-release-sealer.mjs'
      - '.github/workflows/run5-finalizer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: run5-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'gttome/Daily-AI-Brief'
    runs-on: ubuntu-latest
    env:
      RUN_BRANCH: reliable-edition/dab-edition-2026-10-02-run5
      EXECUTION_ID: reliable-edition-20261002-run5
      EXECUTION_KEY: 2026-10-02-run5
      EDITION_ID: dab-edition-2026-10-02
      FINALIZER_OWNER: github-actions-run5-finalizer-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out protected control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: control
          fetch-depth: 0

      - name: Check out existing Run 5 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: reliable-edition/dab-edition-2026-10-02-run5
          path: run
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Verify Task 17 is complete and Tasks 18-21 are not already complete
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          event_dir="run/_records/edition-execution/events/$EXECUTION_KEY"
          [ -d "$event_dir" ]
          ls "$event_dir"/17-done*.json >/dev/null
          if ls "$event_dir"/21-done*.json >/dev/null 2>&1; then
            echo "already_done=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_done=false" >> "$GITHUB_OUTPUT"

      - name: Merge protected main without rebasing
        if: steps.boundary.outputs.already_done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C run config user.name "github-actions[bot]"
          git -C run config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git -C run fetch --no-tags origin main
          if ! git -C run merge-base --is-ancestor origin/main HEAD; then
            if ! git -C run merge --no-edit origin/main; then
              conflicts="$(git -C run diff --name-only --diff-filter=U)"
              if [ "$conflicts" != "data/operations/active-production-run.json" ]; then
                echo "Unexpected merge conflicts: $conflicts" >&2
                exit 1
              fi
              git -C run checkout --ours data/operations/active-production-run.json
              git -C run add data/operations/active-production-run.json
              git -C run commit --no-edit
            fi
          fi

      - name: Acquire fenced writer authority for Tasks 18-21
        if: steps.boundary.outputs.already_done != 'true'
        id: fence
        shell: bash
        run: |
          set -euo pipefail
          lease_rel="_records/edition-execution/writer-leases/$EXECUTION_ID.json"
          node control/_tools/run-supervisor.mjs writer-lease \
            --execution-id "$EXECUTION_ID" \
            --owner-id "$FINALIZER_OWNER" \
            --ttl-ms 1800000 \
            --takeover-dead-owner true \
            --current "run/$lease_rel" \
            --output /tmp/run5-finalizer-lease.json >/tmp/run5-finalizer-fence.json
          cp /tmp/run5-finalizer-lease.json "run/$lease_rel"
          generation="$(node -e "const x=require('/tmp/run5-finalizer-lease.json');process.stdout.write(String(x.generation))")"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          git -C run add "$lease_rel"
          if ! git -C run diff --cached --quiet; then
            git -C run commit -m "Fence Run 5 Tasks 18-21 finalizer"
            git -C run push origin "HEAD:$RUN_BRANCH"
          fi

      - name: Assemble and validate Task 18
        if: steps.boundary.outputs.already_done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git -C control rev-parse HEAD)"
          BASELINE_SHA="$baseline" node run/_tools/run5-post-image-finalizer.mjs run

      - name: Commit Task 18 candidate
        if: steps.boundary.outputs.already_done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C run add -A
          if ! git -C run diff --cached --quiet; then
            git -C run commit -m "Assemble and validate Run 5 October 2 candidate"
            git -C run push origin "HEAD:$RUN_BRANCH"
          fi

      - name: Seal and qualify Tasks 19-21
        if: steps.boundary.outputs.already_done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git -C control rev-parse HEAD)"
          candidate="$(git -C run rev-parse HEAD)"
          BASELINE_SHA="$baseline" RUN_CANDIDATE_SHA="$candidate" node run/_tools/run5-release-sealer.mjs run

      - name: Commit sealed Run 5 release evidence and hand back to Supervisor
        if: steps.boundary.outputs.already_done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          lease_rel="_records/edition-execution/writer-leases/$EXECUTION_ID.json"
          node -e "const fs=require('fs');const p='run/'+process.argv[1];const x=JSON.parse(fs.readFileSync(p,'utf8'));const at=new Date().toISOString();x.last_heartbeat_at=at;x.expires_at=at;x.released_at=at;x.release_reason='TASKS_18_THROUGH_21_DONE_HANDOFF_TO_SUPERVISOR';fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n')" "$lease_rel"
          git -C run add -A
          if ! git -C run diff --cached --quiet; then
            git -C run commit -m "Seal and qualify Run 5 October 2 release candidate"
            git -C run push origin "HEAD:$RUN_BRANCH"
          fi
