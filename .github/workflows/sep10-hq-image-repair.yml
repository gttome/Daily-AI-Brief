name: September 10 HQ image repair

on:
  push:
    branches:
      - repair/2026-09-10-hq-images
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Generate six HQ textbook images and cache-bust canonical paths
        run: python _tools/sep10_hq_image_repair.py

      - name: Regenerate all derived reader surfaces
        run: node _generator/cli.mjs refresh-derived --date 2026-09-10

      - name: Refresh accessibility evidence
        run: node _generator/cli.mjs audit-accessibility --date 2026-09-10 --reviewed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out _records/accessibility/2026-09-10.json

      - name: Verify six PNG assets and exact dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          root = Path('briefs/images/2026-09-10')
          files = sorted(root.glob('*.png'))
          assert len(files) == 6, f'expected 6 PNGs, found {len(files)}'
          expected = {
            '01-anthropic-containment.png',
            '02-github-agent-permissions.png',
            '03-adobe-document-agent.png',
            '04-microsoft-work-value.png',
            '05-google-opal-web-errands.png',
            '06-skillmd-portability.png',
          }
          assert {p.name for p in files} == expected, 'unexpected Sep 10 image set'
          for p in files:
              data = p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{p} is not PNG'
              w, h = struct.unpack('>II', data[16:24])
              assert (w, h) == (1200, 630), f'{p} is {w}x{h}'
              print(p.name, len(data), f'{w}x{h}')
          PY

      - name: Run repository test and contract suite
        run: |
          node --test _generator/test/*.test.mjs
          node _tools/validate-contracts.mjs
          node _generator/cli.mjs validate-repo --commit "${GITHUB_SHA}"
          node _generator/cli.mjs integration-check --date 2026-09-10

      - name: Remove one-use repair implementation
        run: |
          rm -f _tools/sep10_hq_image_repair.py
          rm -f .github/workflows/sep10-hq-image-repair.yml

      - name: Commit validated repair candidate
        run: |
          git config user.name "George"
          git config user.email "130812356+gttome@users.noreply.github.com"
          git add -A
          git commit -m "Restore September 10 textbook-quality story images"
          git push origin HEAD:repair/2026-09-10-hq-images
