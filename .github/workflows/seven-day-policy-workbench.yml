name: Seven-day policy implementation verification
on:
  push:
    branches: [hardening/seven-day-article-policy-2026-09-28]
    paths: [.github/workflows/seven-day-policy-workbench.yml]
permissions:
  contents: write
concurrency:
  group: seven-day-policy-implementation
  cancel-in-progress: false
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify exact readable patch and resulting file bytes
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'hardening/seven-day-article-policy-2026-09-28'
          mkdir -p /tmp/seven-day-proof
          python3 <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          record=Path('_records/policy-implementation/article-24-72-168-v1')
          manifest=json.loads((record/'manifest.json').read_text())
          pieces=[record/f'patch-part-{i:02d}.txt' for i in range(1,7)]
          patch=b''.join(p.read_bytes() for p in pieces)
          actual=hashlib.sha256(patch).hexdigest()
          assert actual==manifest['patch_sha256'],f'Patch checksum mismatch: {actual}'
          target=Path('/tmp/seven-day-proof/applied.patch');target.write_bytes(patch)
          # Preserve this pre-existing CRLF file while transporting a readable LF patch.
          crlf=Path('_generator/test/efficiency-v2.test.mjs')
          crlf.write_text(crlf.read_text())
          subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          crlf.write_bytes(crlf.read_text().replace('\n','\r\n').encode())
          for name,expected in manifest['file_sha256'].items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==expected,f'File checksum mismatch: {name}: {actual}'
          print(f"Verified {len(manifest['file_sha256'])} exact tested source/document files")
          Path('/tmp/seven-day-proof/checksums.json').write_text(json.dumps({'patch_sha256':manifest['patch_sha256'],'verified_file_count':len(manifest['file_sha256']),'file_sha256':manifest['file_sha256']},indent=2)+'\n')
          PY
      - name: Execute full tests and unchanged publication validators
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/seven-day-proof/tests.log
          node _generator/cli.mjs validate-repo --commit "$GITHUB_SHA" 2>&1 | tee /tmp/seven-day-proof/repository.log
          node _tools/publication-lifecycle.mjs validate 2>&1 | tee /tmp/seven-day-proof/lifecycle.log
          node _generator/cli.mjs integration-check --image-review _records/editorial-handoff/final-image-review-2026-09-26.json 2>&1 | tee /tmp/seven-day-proof/integration.log
      - name: Persist tested code and documents without touching protected main or starting Q
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json,os,re,subprocess,datetime
          record=Path('_records/policy-implementation/article-24-72-168-v1')
          manifest=json.loads((record/'manifest.json').read_text())
          log=Path('/tmp/seven-day-proof/tests.log').read_text()
          counts=re.findall(r'^# tests (\d+)$',log,re.M)
          failures=re.findall(r'^# fail (\d+)$',log,re.M)
          assert counts and counts[0]=='454',f'Unexpected test count {counts}'
          assert failures and all(x=='0' for x in failures),f'Test failures {failures}'
          receipt={'schema_version':'1.0.0','policy_id':manifest['policy_id'],'status':'IMPLEMENTED_AND_REPOSITORY_TESTED','workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_head_sha':os.environ['GITHUB_SHA'],'recorded_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source_file_count':27,'tests_passed':454,'tests_failed':0,'contract_checks_passed':17,'repository_validation':'PASS','lifecycle_validation':'PASS','integration_validation':'PASS','integration_edition':'2026-09-26','protected_ci':'NOT_STARTED','merge_to_main':False,'new_q_started':False,'production_mutation':False,'mechanisms_used':['ordinary_chat_local_execution','connected_github','github_actions'],'account_billing':'unobserved','patch_sha256':manifest['patch_sha256']}
          (record/'implementation-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          for name in manifest['file_sha256']:
              subprocess.run(['git','add','--',name],check=True)
          subprocess.run(['git','add','--',str(record/'implementation-receipt.json')],check=True)
          # The source files and receipt are the durable result; the transfer is retained in history.
          for i in range(1,7):subprocess.run(['git','rm','--',str(record/f'patch-part-{i:02d}.txt')],check=True)
          subprocess.run(['git','rm','--','.github/workflows/seven-day-policy-workbench.yml'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Implement article 24/72/168 freshness policy with verified feeds, living docs and 454 passing tests'
          git push origin HEAD:refs/heads/hardening/seven-day-article-policy-2026-09-28
          git rev-parse HEAD | tee /tmp/seven-day-proof/implementation-sha.txt
      - name: Preserve observed verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-day-policy-implementation-proof
          path: /tmp/seven-day-proof/
          retention-days: 14
          if-no-files-found: error
