name: Seven-day schema compatibility closure
on:
  push:
    branches: [hardening/seven-day-article-policy-2026-09-28]
    paths: [.github/workflows/seven-day-schema-closure.yml]
permissions:
  contents: write
concurrency:
  group: seven-day-schema-closure
  cancel-in-progress: false
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Align optional metadata without changing historical requirements
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'hardening/seven-day-article-policy-2026-09-28'
          python3 <<'PY'
          from pathlib import Path
          import hashlib,json
          expected={'_contracts/v1/edition.schema.json':'ab91b72423fb64a7a08cfb7f6efb731989b277d52a1baac58c6f29fafe81d63f','_tools/validate-contracts.mjs':'1d71aa0cbd1207da8b15a8a76cfcc1bd2d73e6496f5918fa587e215cbd07b0b2'}
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,f'Concurrent source change: {name}'
          p=Path('_contracts/v1/edition.schema.json');s=json.loads(p.read_text())
          s['properties']['article_freshness_policy']={'type':'string','enum':['article-24-72-168-v1','article-24-72-skills168-v1'],'description':'Optional article-policy identity. Absence preserves the historical ordinary-72/Skills-168 interpretation; runtime validation enforces age and disclosure.'}
          s['$defs']['story']['properties']['freshness']={'type':'object','additionalProperties':False,'required':['tier','source_published_at'],'properties':{'tier':{'enum':['primary','fallback']},'source_published_at':{'type':'string','format':'date-time'},'fallback_band':{'enum':['normal','extended']},'fallback_reason':{'type':'string','minLength':1}}}
          p.write_text(json.dumps(s,indent=2)+'\n')
          p=Path('_tools/validate-contracts.mjs');t=p.read_text();before="const failures = results.filter(item => item.result === 'FAIL');"
          assert t.count(before)==1
          code="""// Optional article freshness metadata must not break historical schema consumers.
          // Age, cutoff, priority and substantive fallback reasons remain runtime gates.
          {
            const contract = manifest.contracts.find(item => item.name === 'edition');
            const schema = readJson(path.join(contractDir, contract.schema));
            const original = readJson(path.join(contractDir, contract.valid_example));
            const current = structuredClone(original);
            current.article_freshness_policy = 'article-24-72-168-v1';
            current.stories[0].freshness = {tier:'fallback', source_published_at:'2026-09-24T12:00:00Z', fallback_band:'extended', fallback_reason:'No newer qualifying article filled this focus after bounded evidence and novelty review.'};
            const cases = [
              ['historical-without-policy', original, true],
              ['current-extended-metadata', current, true],
              ['current-primary-metadata', (() => {const x=structuredClone(current); x.stories[0].freshness={tier:'primary',source_published_at:'2026-09-28T12:00:00Z'}; return x;})(), true],
              ['legacy-explicit-policy', {...original,article_freshness_policy:'article-24-72-skills168-v1'}, true],
              ['unknown-policy-rejected', {...current,article_freshness_policy:'unapproved'}, false],
              ['invalid-band-rejected', (() => {const x=structuredClone(current); x.stories[0].freshness.fallback_band='unbounded'; return x;})(), false],
              ['undated-freshness-rejected', (() => {const x=structuredClone(current); delete x.stories[0].freshness.source_published_at; return x;})(), false]
            ];
            for (const [name, example, valid] of cases) {
              const errors = validate(example, schema, schema);
              const pass = valid ? errors.length === 0 : errors.length > 0;
              results.push({test:`article-schema:${name}`, result:pass?'PASS':'FAIL', errors:pass?[]:errors.length?errors:['Invalid metadata was accepted']});
            }
          }

          """
          p.write_text(t.replace(before,code+before))
          p=Path('docs/operations/LIVING-SYSTEM-OPERATIONS.md')
          p.write_text(p.read_text()+'\n\n### Seven-day article schema compatibility and transfer recovery — September 28, 2026\n\nThe canonical v1 schema now permits the optional article policy identity and story freshness metadata without adding requirements to historical fixtures. Seven focused schema checks cover current primary/extended metadata, explicit legacy identity, absent historical identity, and rejection of unknown policies, invalid bands and undated freshness. Runtime `validateEdition` remains responsible for age boundaries, actual cutoff, fallback reasons and publication checks; schema acceptance alone is not qualification or publication proof.\n\nWhen a GitHub Actions runner cannot push workflow-file changes, preserve its tested commit and failed execution evidence. An authorized connected GitHub app may fast-forward the existing nonproduction implementation branch to that exact verified commit after confirming its parent and tree. Do not infer a repository-wide access failure, ask for new credentials, rerun completed audits, force-update a ref, or bypass protected PR CI. Run 36459299324 created commit 8e7168c9bbd2317d86eba8e082a2deae6382885c; its failed runner push was recovered through this connected fast-forward path.\n')
          PY
      - name: Run actual contract checks
        run: |
          set -euo pipefail
          node _tools/validate-contracts.mjs | tee /tmp/article-schema-checks.json
          node -e "const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/article-schema-checks.json'));if(x.failed!==0||x.passed!==24)process.exit(1)"
      - name: Persist only reviewed schema, tests, documentation and receipt
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json,os,datetime
          r={'schema_version':'1.0.0','policy_id':'article-24-72-168-v1','recorded_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_head_sha':os.environ['GITHUB_SHA'],'contract_checks_passed':24,'contract_checks_failed':0,'historical_required_fields_changed':False,'protected_ci':'SEPARATE_REQUIRED_CHECK','new_q_started':False,'production_mutation':False}
          Path('_records/policy-implementation/article-24-72-168-v1/schema-compatibility-receipt.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          git add -- _contracts/v1/edition.schema.json _tools/validate-contracts.mjs docs/operations/LIVING-SYSTEM-OPERATIONS.md _records/policy-implementation/article-24-72-168-v1/schema-compatibility-receipt.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align optional article-policy schema and prove seven compatibility cases'
          git push origin HEAD:refs/heads/hardening/seven-day-article-policy-2026-09-28
