<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><rect x="24" y="18" width="1152" height="594" rx="20" fill="#fff" stroke="#cdd5dd" stroke-width="2"/><rect x="24" y="18" width="10" height="594" fill="#967019"/><text x="48" y="47" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#967019">APPLIED GENERATIVE AI</text><text x="48" y="82" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1c3553">AI at work is a system, not a standalone chat window</text><text x="48" y="132" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6976">The durable operating model connects organizational context, copilots and agents, workflow execution, governance, and</text><text x="48" y="152" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6976">measurable outcomes.</text><rect x="48" y="210" width="240" height="182" rx="14" fill="#f7f9fb" stroke="#967019" stroke-width="2"/><circle cx="72" cy="234" r="17" fill="#967019"/><text x="72" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">1</text><text x="64" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1c3553">Work context</text><text x="64" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">People, data, documents,</text><text x="64" y="339" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">permissions, and business</text><text x="64" y="356" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">intent.</text><line x1="293" y1="301" x2="305" y2="301" stroke="#5c6976" stroke-width="3"/><polygon points="305,301 295,295 295,307" fill="#5c6976"/><rect x="312" y="210" width="240" height="182" rx="14" fill="#f7f9fb" stroke="#967019" stroke-width="2"/><circle cx="336" cy="234" r="17" fill="#967019"/><text x="336" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">2</text><text x="328" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1c3553">Copilots + agents</text><text x="328" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">Models reason over governed</text><text x="328" y="339" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">context and planned actions.</text><line x1="557" y1="301" x2="569" y2="301" stroke="#5c6976" stroke-width="3"/><polygon points="569,301 559,295 559,307" fill="#5c6976"/><rect x="576" y="210" width="240" height="182" rx="14" fill="#f7f9fb" stroke="#967019" stroke-width="2"/><circle cx="600" cy="234" r="17" fill="#967019"/><text x="600" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">3</text><text x="592" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1c3553">Workflow execution</text><text x="592" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">AI assists or performs</text><text x="592" y="339" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">bounded steps inside real</text><text x="592" y="356" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">work.</text><line x1="821" y1="301" x2="833" y2="301" stroke="#5c6976" stroke-width="3"/><polygon points="833,301 823,295 823,307" fill="#5c6976"/><rect x="840" y="210" width="240" height="182" rx="14" fill="#f7f9fb" stroke="#967019" stroke-width="2"/><circle cx="864" cy="234" r="17" fill="#967019"/><text x="864" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">4</text><text x="856" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1c3553">Measured outcomes</text><text x="856" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">Humans review quality, risk,</text><text x="856" y="339" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">time saved, and business</text><text x="856" y="356" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">results.</text><rect x="48" y="416" width="1056" height="70" rx="12" fill="#f8fafb" stroke="#cdd5dd"/><text x="68" y="443" font-family="Arial" font-size="18" font-weight="700" fill="#967019">Org context</text><text x="68" y="467" font-family="Arial" font-size="12" fill="#5c6976">GROUNDING</text><text x="326" y="443" font-family="Arial" font-size="18" font-weight="700" fill="#967019">Workflow</text><text x="326" y="467" font-family="Arial" font-size="12" fill="#5c6976">ACTION</text><text x="584" y="443" font-family="Arial" font-size="18" font-weight="700" fill="#967019">Governance</text><text x="584" y="467" font-family="Arial" font-size="12" fill="#5c6976">CONTROL</text><text x="842" y="443" font-family="Arial" font-size="18" font-weight="700" fill="#967019">Outcomes</text><text x="842" y="467" font-family="Arial" font-size="12" fill="#5c6976">MEASURE</text><rect x="48" y="512" width="1056" height="52" rx="10" fill="#f7f9fb"/><text x="64" y="543" font-family="Arial" font-size="13" font-weight="700" fill="#967019">KEY CONTROL</text><text x="170" y="541" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#334455">Measure adoption at the workflow outcome—quality, time, risk, and value—not at prompt volume.</text><text x="1104" y="594" text-anchor="end" font-family="Arial" font-size="11" fill="#87919b">Daily Generative AI Brief · Sep 25, 2026</text></svg>