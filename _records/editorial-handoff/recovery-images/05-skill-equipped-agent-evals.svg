<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><rect x="24" y="18" width="1152" height="594" rx="20" fill="#fff" stroke="#cdd5dd" stroke-width="2"/><rect x="24" y="18" width="10" height="594" fill="#6f4e9b"/><text x="48" y="47" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6f4e9b">AGENTS FOR EVERYONE</text><text x="48" y="82" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1c3553">Evaluating whether an agent uses the right skill</text><text x="48" y="114" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1c3553">correctly</text><text x="48" y="132" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6976">Reusable skills make agent behavior portable, but they also create new failure modes: selecting the wrong skill or</text><text x="48" y="152" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5c6976">failing to follow the skill’s procedure.</text><rect x="48" y="210" width="240" height="182" rx="14" fill="#f7f9fb" stroke="#6f4e9b" stroke-width="2"/><circle cx="72" cy="234" r="17" fill="#6f4e9b"/><text x="72" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">1</text><text x="64" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1c3553">Task arrives</text><text x="64" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">A real request enters the</text><text x="64" y="339" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">agent workflow.</text><line x1="293" y1="301" x2="305" y2="301" stroke="#5c6976" stroke-width="3"/><polygon points="305,301 295,295 295,307" fill="#5c6976"/><rect x="312" y="210" width="240" height="182" rx="14" fill="#f7f9fb" stroke="#6f4e9b" stroke-width="2"/><circle cx="336" cy="234" r="17" fill="#6f4e9b"/><text x="336" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">2</text><text x="328" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1c3553">Skill selection</text><text x="328" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">Agent chooses the reusable</text><text x="328" y="339" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">procedure that best fits the</text><text x="328" y="356" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">task.</text><line x1="557" y1="301" x2="569" y2="301" stroke="#5c6976" stroke-width="3"/><polygon points="569,301 559,295 559,307" fill="#5c6976"/><rect x="576" y="210" width="240" height="182" rx="14" fill="#f7f9fb" stroke="#6f4e9b" stroke-width="2"/><circle cx="600" cy="234" r="17" fill="#6f4e9b"/><text x="600" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">3</text><text x="592" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1c3553">Instruction execution</text><text x="592" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">Agent follows required steps,</text><text x="592" y="339" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">tools, and constraints.</text><line x1="821" y1="301" x2="833" y2="301" stroke="#5c6976" stroke-width="3"/><polygon points="833,301 823,295 823,307" fill="#5c6976"/><rect x="840" y="210" width="240" height="182" rx="14" fill="#f7f9fb" stroke="#6f4e9b" stroke-width="2"/><circle cx="864" cy="234" r="17" fill="#6f4e9b"/><text x="864" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">4</text><text x="856" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1c3553">Evaluator checks</text><text x="856" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">Score selection accuracy and</text><text x="856" y="339" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">instruction-following</text><text x="856" y="356" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334455">fidelity.</text><rect x="48" y="416" width="1056" height="70" rx="12" fill="#f8fafb" stroke="#cdd5dd"/><text x="68" y="443" font-family="Arial" font-size="18" font-weight="700" fill="#6f4e9b">Task set</text><text x="68" y="467" font-family="Arial" font-size="12" fill="#5c6976">TEST</text><text x="326" y="443" font-family="Arial" font-size="18" font-weight="700" fill="#6f4e9b">Skill selection</text><text x="326" y="467" font-family="Arial" font-size="12" fill="#5c6976">METRIC</text><text x="584" y="443" font-family="Arial" font-size="18" font-weight="700" fill="#6f4e9b">Instruction fidelity</text><text x="584" y="467" font-family="Arial" font-size="12" fill="#5c6976">METRIC</text><text x="842" y="443" font-family="Arial" font-size="18" font-weight="700" fill="#6f4e9b">Pass / fail</text><text x="842" y="467" font-family="Arial" font-size="12" fill="#5c6976">GATE</text><rect x="48" y="512" width="1056" height="52" rx="10" fill="#f7f9fb"/><text x="64" y="543" font-family="Arial" font-size="13" font-weight="700" fill="#6f4e9b">KEY CONTROL</text><text x="170" y="541" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#334455">A polished final answer does not prove the correct skill was selected or that required instructions were followed.</text><text x="1104" y="594" text-anchor="end" font-family="Arial" font-size="11" fill="#87919b">Daily Generative AI Brief · Sep 25, 2026</text></svg>