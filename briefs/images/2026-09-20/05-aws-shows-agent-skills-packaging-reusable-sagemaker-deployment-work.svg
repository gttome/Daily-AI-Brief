<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Four-step diagram showing a reusable skill package, a coding agent, a SageMaker deployment task, and a repeatable validated result."><rect width="1200" height="630" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs><text x="60" y="55" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#17365d">Reusable Agent Skills deployment</text><path d="M300.0,320.0 L380.0,320.0" stroke="#6b7280" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="340" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#5b6470">flow</text><path d="M560.0,320.0 L640.0,320.0" stroke="#6b7280" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="600" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#5b6470">flow</text><path d="M820.0,320.0 L900.0,320.0" stroke="#6b7280" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="860" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#5b6470">flow</text><g><rect x="120" y="265" width="180" height="110" rx="14" fill="#ffffff" stroke="#9c2f2f" stroke-width="2.4"/><rect x="120" y="265" width="7" height="110" rx="3" fill="#9c2f2f"/><text x="210" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b3a">Skill package</text><text x="210" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">Capture the procedure, checks,</text><text x="210" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">and examples once.</text></g><g><rect x="380" y="265" width="180" height="110" rx="14" fill="#ffffff" stroke="#2f6b9a" stroke-width="2.4"/><rect x="380" y="265" width="7" height="110" rx="3" fill="#2f6b9a"/><text x="470" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b3a">Coding agent</text><text x="470" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">Let the agent select the</text><text x="470" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">reusable skill when relevant.</text></g><g><rect x="640" y="265" width="180" height="110" rx="14" fill="#ffffff" stroke="#3f704d" stroke-width="2.4"/><rect x="640" y="265" width="7" height="110" rx="3" fill="#3f704d"/><text x="730" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b3a">Deployment task</text><text x="730" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">Apply the packaged knowledge to</text><text x="730" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">the deployment workflow.</text></g><g><rect x="900" y="265" width="180" height="110" rx="14" fill="#ffffff" stroke="#7a5a13" stroke-width="2.4"/><rect x="900" y="265" width="7" height="110" rx="3" fill="#7a5a13"/><text x="990" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b3a">Repeatable result</text><text x="990" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">Reuse the same governed method</text><text x="990" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">on future tasks.</text></g><circle cx="95" cy="515" r="5" fill="#9c2f2f"/><text x="112" y="520" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#283c4b">This is today’s required Agent Skills story.</text><circle cx="95" cy="545" r="5" fill="#9c2f2f"/><text x="112" y="550" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#283c4b">The transferable idea is reusable expertise, not the specific cloud service.</text><text x="1140" y="604" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280">Daily Generative AI Brief · explanatory diagram</text></svg>