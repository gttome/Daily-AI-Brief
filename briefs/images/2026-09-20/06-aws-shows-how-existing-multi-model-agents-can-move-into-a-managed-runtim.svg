<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Four-step diagram showing an existing agent, a runtime contract, managed AgentCore execution, and operational controls at scale."><rect width="1200" height="630" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs><text x="60" y="55" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#17365d">Migrating an agent to a managed runtime</text><path d="M300.0,320.0 L380.0,320.0" stroke="#6b7280" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="340" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#5b6470">flow</text><path d="M560.0,320.0 L640.0,320.0" stroke="#6b7280" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="600" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#5b6470">flow</text><path d="M820.0,320.0 L900.0,320.0" stroke="#6b7280" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="860" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#5b6470">flow</text><g><rect x="120" y="265" width="180" height="110" rx="14" fill="#ffffff" stroke="#9c2f2f" stroke-width="2.4"/><rect x="120" y="265" width="7" height="110" rx="3" fill="#9c2f2f"/><text x="210" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b3a">Existing agent</text><text x="210" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">Preserve the task logic and</text><text x="210" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">model choices.</text></g><g><rect x="380" y="265" width="180" height="110" rx="14" fill="#ffffff" stroke="#2f6b9a" stroke-width="2.4"/><rect x="380" y="265" width="7" height="110" rx="3" fill="#2f6b9a"/><text x="470" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b3a">Runtime contract</text><text x="470" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">Define the execution, identity,</text><text x="470" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">and tool contract.</text></g><g><rect x="640" y="265" width="180" height="110" rx="14" fill="#ffffff" stroke="#3f704d" stroke-width="2.4"/><rect x="640" y="265" width="7" height="110" rx="3" fill="#3f704d"/><text x="730" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b3a">Managed runtime</text><text x="730" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">Move work into managed agent</text><text x="730" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">infrastructure.</text></g><g><rect x="900" y="265" width="180" height="110" rx="14" fill="#ffffff" stroke="#7a5a13" stroke-width="2.4"/><rect x="900" y="265" width="7" height="110" rx="3" fill="#7a5a13"/><text x="990" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#172b3a">Operate at scale</text><text x="990" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">Add monitoring, scaling, and</text><text x="990" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#425466">operational controls.</text></g><circle cx="95" cy="515" r="5" fill="#9c2f2f"/><text x="112" y="520" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#283c4b">Production agents need an operating environment, not only prompts and models.</text><circle cx="95" cy="545" r="5" fill="#9c2f2f"/><text x="112" y="550" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#283c4b">Separating agent logic from runtime infrastructure makes migration easier.</text><text x="1140" y="604" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280">Daily Generative AI Brief · explanatory diagram</text></svg>