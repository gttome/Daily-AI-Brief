<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Daily Generative AI Brief credit reduction roadmap</title>
  <desc id="desc">A staged roadmap from the September 17 baseline of 566 owner-observed credits toward a sustained target below 100 credits per Brief while preserving quality and reliability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="88" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700">Daily Generative AI Brief — Path to &lt;100 Work Credits</text>
  <text x="80" y="132" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Optimization roadmap after the September 18, 2026 production measurement</text>

  <g filter="url(#shadow)">
    <rect x="80" y="195" width="310" height="150" rx="22" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="110" y="242" fill="#fecaca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">MEASURED BASELINE</text>
    <text x="110" y="296" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="50" font-weight="800">566 credits</text>
    <text x="110" y="326" fill="#fecaca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Sep 17 • 50:19 wall time</text>

    <rect x="440" y="195" width="310" height="150" rx="22" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="470" y="242" fill="#fde68a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">SEP 18 CONTROL RUN</text>
    <text x="470" y="290" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">New architecture</text>
    <text x="470" y="326" fill="#fde68a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Capture real stage + credit evidence</text>

    <rect x="800" y="195" width="310" height="150" rx="22" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <text x="830" y="242" fill="#a5f3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">OPTIMIZE</text>
    <text x="830" y="286" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Offload + reuse</text>
    <text x="830" y="318" fill="#cffafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Prewarm • cache • delta • checkpoints</text>

    <rect x="1160" y="195" width="360" height="150" rx="22" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="1190" y="242" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">SUSTAINED TARGET</text>
    <text x="1190" y="296" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="50" font-weight="800">&lt;100 credits</text>
    <text x="1190" y="326" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">3+ normal runs • quality unchanged</text>
  </g>

  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#none)">
    <path d="M390 270 H430"/>
    <path d="M750 270 H790"/>
    <path d="M1110 270 H1150"/>
  </g>

  <text x="80" y="420" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Primary optimization levers</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="80" y="460" width="450" height="130" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="110" y="500" fill="#bfdbfe" font-size="21" font-weight="700">1 • Move deterministic work out of Work</text>
    <text x="110" y="534" fill="#e2e8f0" font-size="18">Acquisition, filtering, rendering, QA, route checks,</text>
    <text x="110" y="562" fill="#e2e8f0" font-size="18">delta validation and publication mechanics.</text>

    <rect x="575" y="460" width="450" height="130" rx="18" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
    <text x="605" y="500" fill="#a5f3fc" font-size="21" font-weight="700">2 • Reuse evidence aggressively</text>
    <text x="605" y="534" fill="#e2e8f0" font-size="18">Portable prewarm cache, conditional revalidation,</text>
    <text x="605" y="562" fill="#e2e8f0" font-size="18">content hashes and changed-only semantic refresh.</text>

    <rect x="1070" y="460" width="450" height="130" rx="18" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <text x="1100" y="500" fill="#ddd6fe" font-size="21" font-weight="700">3 • Minimize semantic/model surface</text>
    <text x="1100" y="534" fill="#e2e8f0" font-size="18">One compact editorial pass, structured outputs,</text>
    <text x="1100" y="562" fill="#e2e8f0" font-size="18">no routine re-summarization or model-based QA.</text>

    <rect x="80" y="625" width="450" height="130" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
    <text x="110" y="665" fill="#fde68a" font-size="21" font-weight="700">4 • Eliminate reruns and repair loops</text>
    <text x="110" y="699" fill="#e2e8f0" font-size="18">Durable checkpoints, targeted repairs, immutable</text>
    <text x="110" y="727" fill="#e2e8f0" font-size="18">receipts and resume-from-stage behavior.</text>

    <rect x="575" y="625" width="450" height="130" rx="18" fill="#3f1d2e" stroke="#f472b6" stroke-width="2"/>
    <text x="605" y="665" fill="#fbcfe8" font-size="21" font-weight="700">5 • Reduce image/media Work cost</text>
    <text x="605" y="699" fill="#e2e8f0" font-size="18">Deterministic textbook diagrams where quality passes;</text>
    <text x="605" y="727" fill="#e2e8f0" font-size="18">bounded metadata-first video/podcast discovery.</text>

    <rect x="1070" y="625" width="450" height="130" rx="18" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
    <text x="1100" y="665" fill="#bbf7d0" font-size="21" font-weight="700">6 • Enforce a credit budget governor</text>
    <text x="1100" y="699" fill="#e2e8f0" font-size="18">Per-stage ceilings, early-stop sufficiency gates,</text>
    <text x="1100" y="727" fill="#e2e8f0" font-size="18">and escalation only when quality requires it.</text>
  </g>

  <rect x="80" y="800" width="1440" height="55" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="800" y="835" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Quality is a hard constraint: six stories • 2/2/2 allocation • authoritative evidence • required media handling • zero unresolved Critical/High defects</text>
</svg>