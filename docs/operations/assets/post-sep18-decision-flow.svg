<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Post September 18 Daily Generative AI Brief decision flow</title>
  <desc id="desc">Decision flow for validating the September 18 production run, measuring efficiency, testing prewarm cache handoff, and starting the next optimization tranche.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#475569" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1600" height="980" rx="24" fill="url(#bg)"/>
  <text x="800" y="76" text-anchor="middle" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="700">September 18 → Evidence → Decision → Optimization</text>
  <text x="800" y="116" text-anchor="middle" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Post-run operating flow for the Daily Generative AI Brief</text>

  <g filter="url(#s)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="560" y="165" width="480" height="110" rx="20" fill="#1d4ed8"/>
    <text x="800" y="207" text-anchor="middle" fill="#dbeafe" font-size="20" font-weight="700">1 • FREEZE THE RUN EVIDENCE</text>
    <text x="800" y="244" text-anchor="middle" fill="#fff" font-size="22">SHA • receipt • runtime • credits • QA • routes</text>

    <rect x="560" y="335" width="480" height="110" rx="20" fill="#0f766e"/>
    <text x="800" y="377" text-anchor="middle" fill="#ccfbf1" font-size="20" font-weight="700">2 • QUALITY GATE</text>
    <text x="800" y="414" text-anchor="middle" fill="#fff" font-size="22">6 stories • 2/2/2 • media • zero Critical/High</text>

    <rect x="140" y="515" width="430" height="120" rx="20" fill="#7f1d1d"/>
    <text x="355" y="559" text-anchor="middle" fill="#fecaca" font-size="20" font-weight="700">QUALITY FAILS</text>
    <text x="355" y="596" text-anchor="middle" fill="#fff" font-size="20">Repair only the failed stage.</text>
    <text x="355" y="623" text-anchor="middle" fill="#fff" font-size="18">Do not restart the full pipeline.</text>

    <rect x="585" y="515" width="430" height="120" rx="20" fill="#14532d"/>
    <text x="800" y="559" text-anchor="middle" fill="#bbf7d0" font-size="20" font-weight="700">QUALITY PASSES</text>
    <text x="800" y="596" text-anchor="middle" fill="#fff" font-size="20">Calculate stage shares, cache metrics,</text>
    <text x="800" y="623" text-anchor="middle" fill="#fff" font-size="18">credit deltas and distance to &lt;100.</text>

    <rect x="1030" y="515" width="430" height="120" rx="20" fill="#78350f"/>
    <text x="1245" y="559" text-anchor="middle" fill="#fde68a" font-size="20" font-weight="700">MISSING EVIDENCE</text>
    <text x="1245" y="596" text-anchor="middle" fill="#fff" font-size="20">Mark unavailable with provenance.</text>
    <text x="1245" y="623" text-anchor="middle" fill="#fff" font-size="18">Never infer credits/tokens from proxies.</text>

    <rect x="585" y="705" width="430" height="120" rx="20" fill="#312e81"/>
    <text x="800" y="749" text-anchor="middle" fill="#ddd6fe" font-size="20" font-weight="700">3 • VERIFY PREWARM HANDOFF</text>
    <text x="800" y="786" text-anchor="middle" fill="#fff" font-size="20">Prove publisher consumes portable cache;</text>
    <text x="800" y="813" text-anchor="middle" fill="#fff" font-size="18">then schedule it before the 07:00 run.</text>

    <rect x="585" y="870" width="430" height="78" rx="20" fill="#0f172a"/>
    <text x="800" y="918" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">START NEXT OPTIMIZATION ITERATION</text>
  </g>

  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M800 275 V325"/>
    <path d="M800 445 V505"/>
    <path d="M620 445 C520 470 430 485 360 505"/>
    <path d="M980 445 C1080 470 1170 485 1240 505"/>
    <path d="M800 635 V695"/>
    <path d="M800 825 V860"/>
  </g>

  <text x="395" y="485" fill="#991b1b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">FAIL</text>
  <text x="813" y="485" fill="#166534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">PASS</text>
  <text x="1162" y="485" fill="#92400e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">INCOMPLETE</text>
</svg>